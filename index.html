<script>
// 依参考原型调整盘口列表、开盘表单和短信接口列表。
// 演示账号可查看已关闭盘口，方便在列表中重新开启；发布仍单独校验盘口状态。
prototypeDemoAllScopes=function(){return partitions.map(item=>item[1])};
const modalBeforePartitionReference=modal;
modal=function(title,html){document.getElementById('modal').classList.remove('partition-reference-modal');modalBeforePartitionReference(title,html)};
partitionRows=function(rows){return rows.map((p,index)=>{const i=partitions.indexOf(p),domain=partitionBusinessSettings[p[1]]?.primaryDomain||'—';return `<tr><td>${index+1}</td><td>${esc(p[0])}</td><td>${esc(domain)}</td><td>${esc(p[2]||'—')}</td><td class="${p[4]?'status-on':'status-off'}">${p[4]?'开启':'关闭'}</td><td>${esc(p[6]||'—')}</td><td><button class="link ${p[4]?'red':''}" onclick="toggle(${i})">${p[4]?'停用':'开启'}</button><button class="link" onclick="editPartition(${i})">编辑</button><button class="link" onclick="openPartitionSync('${esc(p[1])}')">配置同步</button></td></tr>`}).join('')};
partitionView=function(){const rows=partitions.filter(p=>visibleScopeIds().includes(p[1]));return `<div class="panel"><div class="filters"><div class="field"><label>盘口名称</label><input id="filterName" placeholder="请输入盘口名称"></div><div class="field"><label>状态</label><select id="filterStatus"><option value="all">全部状态</option><option value="yes">开启</option><option value="no">关闭</option></select></div><button class="btn primary" onclick="filterRows()">查询</button><button class="btn" onclick="document.getElementById('filterName').value='';document.getElementById('filterStatus').value='all';filterRows()">重置</button></div><div class="toolbar"><button class="btn primary" onclick="editPartition(-1)">新增盘口</button></div><div class="wide-scroll"><table class="partition-reference-table"><thead><tr><th style="width:6%">序号</th><th>盘口名称</th><th>主站点</th><th>主账号</th><th>状态</th><th>创建时间</th><th style="width:25%">操作</th></tr></thead><tbody id="rows">${partitionRows(rows)}</tbody></table></div>${pagination(rows.length)}</div>`};
filterRows=function(){const name=document.getElementById('filterName')?.value.trim()||'',status=document.getElementById('filterStatus')?.value||'all',rows=partitions.filter(p=>visibleScopeIds().includes(p[1])&&p[0].includes(name)&&(status==='all'||p[4]===(status==='yes')));document.getElementById('rows').innerHTML=partitionRows(rows);const total=document.querySelector('#rows')?.closest('.panel')?.querySelector('.footer span');if(total)total.textContent='共 '+rows.length+' 条'};
function viewPartitionReference(i){const p=partitions[i];if(!p||!visibleScopeIds().includes(p[1]))return msg('盘口不在当前查看范围内');const s=partitionBusinessSettings[p[1]]||{};modal('查看盘口 · '+esc(p[0]),`<div class="permission-section">盘口基本信息</div><div class="permission-grid"><div class="field"><label>盘口名称</label><input value="${esc(p[0])}" disabled></div><div class="field"><label>盘口主站点</label><input value="${esc(s.primaryDomain||'—')}" disabled></div></div><div class="field"><label>盘口备注</label><input value="${esc(p[5]==='—'?'':p[5])}" disabled></div><div class="permission-section">盘口主账号</div><div class="field"><label>登录名</label><input value="${esc(p[2]||'—')}" disabled></div><div class="actions"><button class="btn" onclick="closeModal()">关闭</button></div>`)}
const partitionOwnerFormBeforeReference=partitionOwnerForm;
partitionOwnerForm=function(){if(partitionOwnerMode==='existing')return partitionOwnerFormBeforeReference();return `<div class="permission-grid"><div class="field"><label>主账号登录名 *</label><input id="partitionLogin" placeholder="全局唯一，不可重复"></div><div class="field"><label>主账号姓名</label><input id="partitionOwnerName" placeholder="选填"></div><div class="field"><label>初始密码 *</label><input id="partitionPassword" type="password" placeholder="至少8位，含字母与数字"></div><div class="field"><label>联系邮箱</label><input id="partitionEmail" placeholder="选填"></div></div>`};
switchPartitionOwner=function(mode){if(partitionEditing>=0)return msg('主账号绑定后不可更改');partitionOwnerMode=mode;const form=document.getElementById('partitionOwnerForm');if(form)form.innerHTML=partitionOwnerForm();document.querySelectorAll('[data-owner-mode]').forEach(button=>button.classList.toggle('selected',button.dataset.ownerMode===mode))};
editPartition=function(i){partitionEditing=i;partitionOwnerMode='existing';const p=partitions[i]||['','', '', '',true,'',''],code=i<0?nextPartitionCode():p[1],settings=partitionBusinessSettings[code]||{};modal(i<0?'新增盘口':'编辑盘口',`<div class="permission-section">① 盘口基本信息</div><div class="permission-grid"><div class="field"><label>盘口名称 *</label><input id="partitionName" value="${esc(p[0])}" placeholder="请输入盘口名称"></div><div class="field"><label>盘口主站点 *</label><input id="partitionPrimaryDomain" value="${esc(settings.primaryDomain||'')}" placeholder="例如 dd1.com"></div></div><input id="partitionCode" type="hidden" value="${esc(code)}"><input id="partitionProductName" type="hidden" value="${esc(settings.productName||p[0]||'')}"/><div class="field"><label>盘口备注</label><input id="partitionNote" value="${esc(p[5]==='—'?'':p[5])}" placeholder="仅平台内部备注，不下发前台（选填）"></div><div class="permission-section">② 盘口主账号配置</div>${i<0?`<div class="owner-mode"><button class="btn selected" data-owner-mode="existing" onclick="switchPartitionOwner('existing')">使用已有账号</button><button class="btn" data-owner-mode="new" onclick="switchPartitionOwner('new')">新建账号</button><span class="muted">已有账号可兼任此分盘主账号；新建账号单独开通。</span></div><div id="partitionOwnerForm">${partitionOwnerForm()}</div>`:`<div class="field"><label>已绑定主账号</label><input value="${esc(p[2]||'—')}" disabled><div class="partition-help">绑定后不可更换。</div></div>`}<div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePartitionReference()">保存</button></div>`);document.getElementById('modal').classList.add('partition-reference-modal')};
const saveNewPartitionBeforeReference=saveNewPartition;
function savePartitionReference(){const name=document.getElementById('partitionName')?.value.trim()||'';const product=document.getElementById('partitionProductName');if(product)product.value=name;const code=document.getElementById('partitionCode')?.value;const before=partitions.length;saveNewPartitionBeforeReference();if(partitions.length>before||!document.getElementById('back')?.classList.contains('open')){const data=partitionBusinessSettings[code]||{};data.productName=name;partitionBusinessSettings[code]=data;render()}}
const togglePartitionBeforeReference=toggle;
toggle=function(i){const p=partitions[i];if(!p)return msg('盘口不存在');p[4]=!p[4];audit((p[4]?'开启盘口 ':'停用盘口 ')+p[0]);renderScope();render();msg(p[0]+' 已'+(p[4]?'开启':'停用'))};
const partitionInterfaceViewBeforeReference=partitionInterfaceView;
partitionInterfaceView=function(){return `<div class="panel"><div class="filters"><div class="field"><label>盘口名称</label><input id="interfaceFilterName" placeholder="请输入盘口名称"></div><button class="btn primary" onclick="filterPartitionInterfaces()">查询</button><button class="btn" onclick="document.getElementById('interfaceFilterName').value='';filterPartitionInterfaces()">重置</button></div><div class="wide-scroll"><table class="partition-reference-table"><thead><tr><th>盘口名称</th><th>短信接口</th><th>短信配置</th></tr></thead><tbody id="partitionInterfaceRows">${partitionInterfaceRows()}</tbody></table></div></div>`};
function partitionInterfaceRows(name=''){return partitions.filter(item=>visibleScopeIds().includes(item[1])&&item[0].includes(name)).map(item=>{const code=item[1],selected=smsProviderData(code).selected,names=selected.map(id=>smsProviderDefinitions.find(def=>def.id===id)?.name).filter(Boolean);return `<tr><td>${esc(item[0])}</td><td>${names.length?names.map(label=>`<span class="tag" style="background:#7753c2;color:#fff;margin:2px 4px">${esc(label)}</span>`).join(''):'<span class="tag orange">待配置</span>'}</td><td><button class="link" onclick="editPartitionInterface('${esc(code)}','sms')">${names.length?'编辑':'配置'}</button></td></tr>`}).join('')||'<tr><td colspan="3" class="muted">暂无匹配盘口</td></tr>'}
function filterPartitionInterfaces(){const name=document.getElementById('interfaceFilterName')?.value.trim()||'';document.getElementById('partitionInterfaceRows').innerHTML=partitionInterfaceRows(name)}
// 接口配置以厂商卡片展示填写进度；列表仅展示完整度，不暴露参数值。
function smsProviderProgress(def,values={}){
  const filled=def.fields.filter(([key])=>String(values[key]||'').trim()).length;
  return {filled,total:def.fields.length,complete:filled===def.fields.length};
}
smsProviderCard=function(def,values={}){
  const progress=smsProviderProgress(def,values);
  return `<section class="sms-provider-card"><div class="sms-provider-card-head"><div><h3>${esc(def.name)}</h3><small>${progress.filled} / ${progress.total} 项已填写</small></div><span class="sms-progress ${progress.complete?'complete':'incomplete'}">${progress.complete?'已完善':'待完善'}</span></div><div class="sms-provider-fields">${def.fields.map(([key,label])=>`<div class="field"><label>${esc(label)}<small>${esc(key)}</small></label><input data-sms-provider="${esc(def.id)}" data-sms-key="${esc(key)}" type="${/SECRET|AUTH_KEY/.test(key)?'password':'text'}" value="${esc(values[key]||'')}" autocomplete="off" placeholder="请输入 ${esc(label)}" oninput="updateSmsProviderProgress(this)"></div>`).join('')}</div></section>`;
};
function updateSmsProviderProgress(input){
  const card=input.closest('.sms-provider-card'),fields=[...card.querySelectorAll('[data-sms-key]')],filled=fields.filter(field=>field.value.trim()).length,badge=card.querySelector('.sms-progress');
  card.querySelector('.sms-provider-card-head small').textContent=`${filled} / ${fields.length} 项已填写`;
  badge.textContent=filled===fields.length?'已完善':'待完善';badge.classList.toggle('complete',filled===fields.length);badge.classList.toggle('incomplete',filled!==fields.length);
  const choice=document.querySelector(`[data-sms-choice="${input.dataset.smsProvider}"]`);
  const details=input.closest('.sms-provider-details');
  if(details){details.querySelector('summary small').textContent=`${filled}/${fields.length} 项已填写`;const status=details.querySelector('summary .sms-progress');status.textContent=filled===fields.length?'已完善':'待完善';status.classList.toggle('complete',filled===fields.length);status.classList.toggle('incomplete',filled!==fields.length)}
  const selected=smsProviderDefinitions.filter(def=>smsSelectedProviders.has(def.id));
  const selectedBox=document.getElementById('smsSelectedProviders');
  if(selectedBox)selectedBox.innerHTML=selected.map(def=>{const values={...(smsDraftValues[def.id]||{})};document.querySelectorAll(`#smsProviderCards [data-sms-provider="${def.id}"]`).forEach(field=>values[field.dataset.smsKey]=field.value);return `<button type="button" onclick="focusSmsProvider('${def.id}')">${esc(def.name)} · ${smsProviderProgress(def,values).filled}/${def.fields.length}<span class="sms-selected-remove" title="移除厂商" onclick="event.stopPropagation();toggleSmsProvider('${def.id}',false)">×</span></button>`}).join('');
}
partitionInterfaceRows=function(name=''){
  return partitions.filter(item=>visibleScopeIds().includes(item[1])&&item[0].toLowerCase().includes(name.toLowerCase())).map(item=>{
    const code=item[1],data=smsProviderData(code),selected=smsProviderDefinitions.filter(def=>data.selected.includes(def.id));
    const ready=selected.filter(def=>smsProviderProgress(def,data.values?.[def.id]).complete);
    const pending=selected.filter(def=>!smsProviderProgress(def,data.values?.[def.id]).complete);
    const labels=ready.map(def=>`<span class="sms-provider-name">${esc(def.name)}</span>`).join('')+pending.map(def=>`<span class="sms-provider-name incomplete">${esc(def.name)} · 待完善</span>`).join('');
    return `<tr><td><b>${esc(item[0])}</b></td><td>${labels||'<span class="tag orange">待配置</span>'}</td><td><button class="link" onclick="editPartitionInterface('${esc(code)}','sms')">${selected.length?'编辑':'配置'}</button></td></tr>`;
  }).join('')||'<tr><td colspan="3" class="muted">暂无匹配盘口</td></tr>';
};
partitionInterfaceView=function(){return `<div class="panel"><div class="filters"><div class="field"><label>盘口名称</label><input id="interfaceFilterName" placeholder="请输入盘口名称" onkeydown="if(event.key==='Enter')filterPartitionInterfaces()"></div><button class="btn primary" onclick="filterPartitionInterfaces()">查询</button><button class="btn" onclick="document.getElementById('interfaceFilterName').value='';filterPartitionInterfaces()">重置</button></div><div class="wide-scroll"><table class="partition-reference-table sms-interface-table"><thead><tr><th>盘口名称</th><th>短信接口</th><th>操作</th></tr></thead><tbody id="partitionInterfaceRows">${partitionInterfaceRows()}</tbody></table></div></div>`};
// 同步历史按目标分盘逐条展示；筛选只影响当前可见的目标分盘。
function partitionSyncHistoryRows(targetFilter='',sourceFilter=''){
  return partitionSyncHistory.flatMap(record=>(record.targets||[]).filter(target=>visibleScopeIds().includes(target)).map(target=>({record,target})))
    .filter(({record,target})=>(!targetFilter||scopeName(target).toLowerCase().includes(targetFilter.toLowerCase()))&&(!sourceFilter||scopeName(record.source).toLowerCase().includes(sourceFilter.toLowerCase())))
    .sort((a,b)=>String(b.record.time||'').localeCompare(String(a.record.time||'')));

async function mailImportUids(input){const file=input.files?.[0];if(!file)return;if(file.size>1024*1024)return msg('请导入小于1MB的UID文件');const text=await file.text(),uids=text.replace(/^\uFEFF/,'').split(/[\s,，;；]+/).filter(x=>/^\d+$/.test(x));if(!uids.length)return msg('文件中没有有效UID');document.getElementById('me-uids').value=[...new Set(uids)].join(',');msg('已导入 '+new Set(uids).size+' 个UID')}

function mailSaveMessage(id,scope){const existing=id?mailFind('messages',id,scope):null;if(id&&(!existing||existing.status!=='pending'))return msg('当前记录已变更，请刷新后重试');const target=mailValue('me-scope');if(!singleAuthorizedScopes().includes(target)||!visibleScopeIds().includes(target))return msg('请选择有权限的生效盘口');const title=mailValue('me-title'),content=mailValue('me-content'),audience=mailValue('me-audience'),rewardType=mailValue('me-reward'),sendType=mailValue('me-sendtype'),uids=[...new Set(mailValue('me-uids').split(/[\s,，;；]+/).filter(Boolean))];if(!title||!content)return msg('请填写标题和站内信内容');if(title.length>100)return msg('标题不能超过100个字符');if(audience!==mailAudienceNames[0]&&(!uids.length||uids.some(x=>!/^\d+$/.test(x))))return msg('请填写有效的数字UID');const cash=rewardType==='无奖励'?0:Number(mailValue('me-cash')),jcoin=rewardType==='无奖励'?0:Number(mailValue('me-jcoin'));if(!Number.isFinite(cash)||!Number.isFinite(jcoin)||cash<0||jcoin<0)return msg('奖励金额必须为非负数字');const sendAt=sendType==='定时发送'?mailValue('me-sendat').replace('T',' '):mailNow(),expiresAt=mailValue('me-expires').replace('T',' ');if(sendType==='定时发送'&&(!sendAt||new Date(sendAt)<=new Date()))return msg('定时发送时间必须晚于当前时间');if(expiresAt&&new Date(expiresAt)<=new Date(sendAt))return msg('过期时间必须晚于发送时间');const data={id:id||mailId(mailStore.messages),scope:target,title,content,audience,legacy:mailValue('me-legacy'),rewardType,sendType,sendAt,expiresAt,uids:uids.join(','),excludeTags:mailValue('me-tags'),note:mailValue('me-note'),sender:currentPrototypeLogin,cash,jcoin,paidCash:rewardType==='付费奖励'?cash:0,paidJcoin:rewardType==='付费奖励'?jcoin:0,push:0,opened:0,claimed:0,recharged:0};const rules=mailStore.rules.filter(r=>r.scope===target&&r.enabled&&data[r.currency]>r.threshold);data.status=rules.length?'review':sendType==='定时发送'?'pending':'sent';if(existing)Object.assign(existing,data);else mailStore.messages.unshift(data);if(rules.length)mailStore.reviews.unshift({key:target+':'+data.id+':'+Date.now(),scope:target,messageId:data.id,title,note:data.note,sendAt,submitter:currentPrototypeLogin,submittedAt:mailNow(),status:'待审核',reviewer:'',reviewedAt:'',reason:'',rules:rules.map(r=>r.title)});else if(data.status==='sent')mailDeliver(data);audit('提交站内信 '+data.id+' · '+scopeName(target));closeModal();if(rules.length){nav('运营管理','站内信管理::站内信审核列表')}else{mailTab=data.status;render()}msg(rules.length?'已提交审核，审核通过后发送':data.status==='pending'?'已加入等待发送列表':'站内信已发送（演示）')}
function mailDeliver(r){const uids=r.audience===mailAudienceNames[0]?['1393018','1393030','1393029']:r.uids.split(',').filter(Boolean);r.push=uids.length;r.sendAt=mailNow();uids.forEach((uid,i)=>mailStore.records.unshift({id:'sent-'+r.id+'-'+Date.now()+'-'+i,scope:r.scope,mode:'主动',messageId:r.id,uid,channel:'官网',status:'未领取',cash:r.rewardType==='免费奖励'?r.cash:0,jcoin:r.rewardType==='免费奖励'?r.jcoin:0,paidCash:r.paidCash,paidJcoin:r.paidJcoin,receivedAt:r.sendAt,openedAt:'',claimedAt:''}))}
function mailMessageDetail(id,scope){const r=mailFind('messages',id,scope);if(!r)return msg('站内信不存在');const reviews=mailStore.reviews.filter(x=>x.messageId===r.id&&x.scope===scope);const fields=[['站内信ID',r.id],['生效盘口',scopeName(scope)],['发送者',r.sender],['收件用户群体',r.audience],['收件UID',r.audience===mailAudienceNames[0]?'全部用户':r.uids],['剔除用户标签',r.excludeTags||'—'],['发送类型',r.sendType],['发送时间',r.sendAt],['过期时间',r.expiresAt||'不限'],['奖励类型',r.rewardType],['cash / jcoin',r.cash+' / '+r.jcoin],['备注',r.note||'—'],...reviews.map(x=>['审核记录',x.status+(x.reason?' · '+x.reason:'')])];mailDialog('站内信详情 · '+esc(r.title),`<dl class="mail-details">${fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><label>站内信内容</label><div class="mail-detail-body">${esc(r.content)}</div><div class="actions"><button class="btn" onclick="closeModal()">关闭</button></div>`)}
function mailNoteEditor(id,scope){const r=mailFind('messages',id,scope);if(!r)return;mailDialog('修改备注',`<label for="mn-note">备注</label><textarea id="mn-note" rows="4">${esc(r.note)}</textarea>${mailActions(`mailSaveNote(${id},'${scope}')`)}`)}
function mailSaveNote(id,scope){const r=mailFind('messages',id,scope);if(!r)return msg('站内信不存在');r.note=mailValue('mn-note');audit('修改站内信备注 '+id);closeModal();render();msg('备注已保存')}
function mailDeleteMessage(id,scope){const r=mailFind('messages',id,scope);if(!r||r.status!=='pending')return;mailDialog('删除待发送站内信',`<p>确认删除「${esc(r.title)}」？删除后停止发送，可在已删除列表重新发送。</p>${mailActions(`mailConfirmDeleteMessage(${id},'${scope}')`,'确认删除')}`)}
function mailConfirmDeleteMessage(id,scope){const r=mailFind('messages',id,scope);if(!r||r.status!=='pending')return msg('当前记录不可删除');r.status='deleted';audit('删除待发送站内信 '+id);closeModal();render();msg('已移入已删除列表')}
function mailTemplateEditor(id=0,scope=''){const t=id?mailFind('templates',id,scope):{};if(!t)return;mailDialog(id?'编辑站内信模板':'添加站内信模板',`<div class="mail-editor">${mailScopeField(scope)}${mailEditorSelect('模板类型','mt-type',['超时赔付','回归福利','活动奖励','系统通知'],t.type)}${mailField('模板标题 *','mt-title',t.title||'','text',true)}<div class="mail-full"><label for="mt-content">模板内容 *</label><textarea id="mt-content" rows="5">${esc(t.content||'')}</textarea></div></div>${mailActions(`mailSaveTemplate(${id},'${scope}')`)}`)}
function mailSaveTemplate(id,scope){const target=mailValue('me-scope'),title=mailValue('mt-title'),content=mailValue('mt-content');if(!title||!content)return msg('请填写模板标题和内容');if(!singleAuthorizedScopes().includes(target))return msg('无该盘口权限');const t=id?mailFind('templates',id,scope):null;if(id&&!t)return msg('模板不存在');const data={id:id||Math.max(0,...mailStore.templates.map(t=>t.id))+1,scope:target,type:mailValue('mt-type'),title,content};if(t)Object.assign(t,data);else mailStore.templates.unshift(data);audit('保存站内信模板 '+data.id);closeModal();render();msg('模板已保存')}
function mailRecordDetail(id,scope){const r=mailStore.records.find(x=>x.id===id&&x.scope===scope&&mailInScope(x));if(!r)return;const fields=[['用户ID',r.uid],['站内信ID',r.messageId],['渠道来源',r.channel],['领取状态',r.status],['收件时间',r.receivedAt],['打开时间',r.openedAt||'—'],['领取时间',r.claimedAt||'—']];mailDialog('用户站内信记录',`<dl class="mail-details">${fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><label>免费奖励</label>${mailReward(r.cash,r.jcoin)}<label style="margin-top:12px">付费奖励</label>${mailReward(r.paidCash,r.paidJcoin)}<div class="actions"><button class="btn" onclick="closeModal()">关闭</button></div>`)}
function mailExportRecords(){const rows=mailRecordRows();const csvValue=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replaceAll('"','""')+'"';const headers=['站内信ID','用户ID','渠道来源','领取状态','付费cash','付费jcoin','免费cash','免费jcoin','收件时间','打开时间','领取时间'];const csv='\uFEFF'+[headers,...rows.map(r=>[r.messageId,r.uid,r.channel,r.status,r.paidCash,r.paidJcoin,r.cash,r.jcoin,r.receivedAt,r.openedAt,r.claimedAt])].map(row=>row.map(csvValue).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=mailLeaf()+'-'+mailDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);msg('已导出符合条件的 '+rows.length+' 条记录')}
function mailRuleEditor(id=0,scope=''){const r=id?mailFind('rules',id,scope):{};if(!r)return;mailDialog(id?'编辑审核规则':'添加审核规则',`<div class="mail-editor">${mailScopeField(scope)}${mailField('规则标题 *','mr-title',r.title||'')}${mailEditorSelect('奖励币种','mr-currency',['cash','jcoin'],r.currency)}${mailField('奖励大于此金额时进入审核 *','mr-threshold',r.threshold??100,'number')}${mailEditorSelect('状态','mr-enabled',['启用','停用'],r.enabled===false?'停用':'启用')}${mailField('备注','mr-note',r.note||'')}</div><p class="mail-help">启用后对后续提交的站内信生效。每条消息按所选币种的单个用户奖励金额判断。</p>${mailActions(`mailSaveRule(${id},'${scope}')`)}`)}
function mailSaveRule(id,scope){const target=mailValue('me-scope'),title=mailValue('mr-title'),raw=mailValue('mr-threshold'),threshold=Number(raw);if(!title||!raw||!Number.isFinite(threshold)||threshold<0)return msg('请填写标题及非负奖励阈值');if(!singleAuthorizedScopes().includes(target))return msg('无该盘口权限');const r=id?mailFind('rules',id,scope):null;if(id&&!r)return msg('审核规则不存在');const data={id:id||Math.max(56,...mailStore.rules.map(x=>x.id))+1,scope:target,title,currency:mailValue('mr-currency'),threshold,enabled:mailValue('mr-enabled')==='启用',note:mailValue('mr-note')};if(r)Object.assign(r,data);else mailStore.rules.unshift(data);audit('保存站内信审核规则 '+data.id);closeModal();render();msg('审核规则已保存')}
function mailToggleRule(id,scope){const r=mailFind('rules',id,scope);if(!r)return;r.enabled=!r.enabled;audit((r.enabled?'启用':'停用')+'站内信审核规则 '+id);render();msg(r.enabled?'审核规则已启用':'审核规则已停用')}
function mailDeleteRule(id,scope){const r=mailFind('rules',id,scope);if(!r)return;mailDialog('删除审核规则',`<p>确认删除「${esc(r.title)}」？已提交的审核记录将保留。</p>${mailActions(`mailConfirmDeleteRule(${id},'${scope}')`,'确认删除')}`)}
function mailConfirmDeleteRule(id,scope){const r=mailFind('rules',id,scope);if(!r)return;mailStore.rules=mailStore.rules.filter(x=>x!==r);audit('删除站内信审核规则 '+id);closeModal();render();msg('审核规则已删除')}
function mailSelectReview(key,checked){if(checked)mailSelected.add(key);else mailSelected.delete(key);const text=document.querySelector('.mail-filter-actions .muted');if(text)text.textContent='已选择 '+mailSelected.size+' 条'}
function mailSelectAll(checked){document.querySelectorAll('[name=mail-review]:not(:disabled)').forEach(x=>{x.checked=checked;mailSelectReview(x.value,checked)})}
let mailReviewKeys=[];
function mailReviewEditor(key=''){const rows=mailStore.reviews.filter(r=>mailInScope(r)&&r.status==='待审核'&&(key?r.key===key:mailSelected.has(r.key)&&mailReviewRows().some(x=>x.key===r.key)));if(!rows.length)return msg('请先选择待审核记录');mailReviewKeys=rows.map(r=>r.key);mailDialog('审核站内信 · '+rows.length+' 条',`<div class="mail-help">审核通过后，立即发送的站内信将模拟发放；定时发送的站内信进入等待发送列表。</div>${rows.map(r=>{const m=mailFind('messages',r.messageId,r.scope);return `<div class="panel"><b>${esc(r.title)}</b><div class="mail-help">${esc(scopeName(r.scope))} · 提交人 ${esc(r.submitter)} · ${esc(r.rules.join('；'))}</div><div>${mailReward(m?.cash,m?.jcoin)}</div><div class="mail-detail-body">${esc(m?.content||'')}</div></div>`}).join('')}<label for="ma-reason">审核意见（拒绝时必填）</label><textarea id="ma-reason" rows="3" placeholder="请输入审核意见"></textarea><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="mailReviewSubmit(false)">拒绝</button><button class="btn green" onclick="mailReviewSubmit(true)">通过审核</button></div>`)}
function mailReviewSubmit(approved){const reason=mailValue('ma-reason');if(!approved&&!reason)return msg('拒绝时请填写审核意见');const rows=mailStore.reviews.filter(r=>mailReviewKeys.includes(r.key)&&mailInScope(r)&&r.status==='待审核');if(!rows.length)return msg('当前审核记录已变更');rows.forEach(r=>{const m=mailFind('messages',r.messageId,r.scope);r.status=approved?'审核通过':'审核拒绝';r.reason=reason;r.reviewer=currentPrototypeLogin;r.reviewedAt=mailNow();if(m){m.status=approved?(m.sendType==='定时发送'&&new Date(m.sendAt)>new Date()?'pending':'sent'):'rejected';if(m.status==='sent')mailDeliver(m)}audit((approved?'审核通过':'审核拒绝')+'站内信 '+r.messageId)});mailSelected.clear();closeModal();render();msg('已'+(approved?'通过':'拒绝')+' '+rows.length+' 条站内信')}
function mailAdvanceStatuses(){mailStore.messages.forEach(m=>{if(m.expiresAt&&['sent','pending'].includes(m.status)&&new Date(m.expiresAt)<=new Date())m.status='expired';else if(m.status==='pending'&&new Date(m.sendAt)<=new Date()){m.status='sent';mailDeliver(m)}})}
// 站内信使用按字段命名的筛选状态，避免旧通用页按输入框位置还原而串值。
const captureBeforeMail=capturePage;
capturePage=function(){if(active==='运营管理'&&mailPages.has(mailLeaf())){delete pageState[active+'/'+page];return}return captureBeforeMail()};
const navBeforeMail=nav;
nav=function(group,target){if(group==='运营管理'&&mailPages.has(String(target||'').split('::').pop()))delete pageState[group+'/'+hierarchyResolve(group,target)];return navBeforeMail(group,target)};
const renderBeforeMail=render;
render=function(){const keys=new Set(mailStore.reviews.filter(r=>mailInScope(r)&&r.status==='待审核').map(r=>r.key));mailSelected=new Set([...mailSelected].filter(key=>keys.has(key)));return renderBeforeMail()};
const genericBeforeMail=generic;
generic=function(){if(active==='运营管理'&&mailPages.has(mailLeaf())){mailAdvanceStatuses();return mailView()}return genericBeforeMail()};
render();
