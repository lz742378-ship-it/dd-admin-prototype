</style><body><header><b>管理后台系统</b><div>当前盘口　<span class="scope-wrap"><button class="btn" id="scopeButton" onclick="scopeToggle()">DD04 ▾</button><div id="scopeMenu" class="scope-menu"></div></span></div><button class="search-icon" title="搜索页面" aria-label="搜索页面" onclick="openSearch()"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></button><div class="right"><select><option>◎ 简体中文</option><option>English</option></select><b style="font-size:13px">账号 分盘口主账号⌄</b></div></header><nav class="tabs" id="tabs"></nav><div id="pageTabs" class="page-tabs"></div><div class="layout"><aside id="sidebar"></aside><main id="main"></main></div><div class="modal-back" id="back"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script>
const groups={'首页管理':['仪表盘','待处理事项'],'运营管理':['用户管理','活动中心','VIP系统','代理系统','游戏厂商','推送 / 站内信','Banner / 拍脸图','任务系统','归因与分享','客服系统'],'订单管理':['充值订单','提现审核','支付通道','订单冲正','人工充值','转盘订单'],'权限管理':['盘口列表','功能管理','账号管理','操作日志'],'系统管理':['配置中心','发布列表','分盘配置对比','风控系统','前端更新','域名轮询','数据上报','系统公告']};let active='首页管理',page='仪表盘';let selectedScopes=["PT01"];let openPages=[{group:active,name:page}],pageState={};let partitions=[['DD01','PT07','pt07_owner','孙磊',true,'—','2026-09-23 15:47'],['DD02','PT05','pt05_owner','刘敏',true,'—','2026-09-23 13:33'],['DD03','PT03','pt03_owner','王强',true,'重点盘口，月流水前列','2026-09-23 11:19'],['DD04','PT01','pt01_owner','张伟',true,'首发盘口，全业务线开放','2026-09-23 09:05'],['DD05','PT08','pt08_owner','周雪',false,'已停用，等待业务方确认回收','2026-09-23 16:54']];let releases=[{id:'REL-008',name:'首充活动 · 充值赠送比例',module:'活动中心',targets:['PT01','PT03','PT05','PT07'],done:[]},{id:'REL-007',name:'游戏厂商 · 游戏排序',module:'游戏厂商',targets:['PT01','PT03'],done:['PT01','PT03']}];let drafts=[];
function scopeLabel(){return selectedScopes.length?partitions.filter(p=>selectedScopes.includes(p[1])).map(p=>p[0]).join('、'):'全部盘口'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function closeModal(){document.getElementById('back').classList.remove('open')}function modal(title,html){document.getElementById('modal').innerHTML='<button class="close" onclick="closeModal()">×</button><h2>'+title+'</h2>'+html;document.getElementById('back').classList.add('open')}function capturePage(){let root=document.getElementById("main");pageState[active+"/"+page]=[...root.querySelectorAll("input,select,textarea")].map(e=>({value:e.value,checked:e.checked}));}function nav(g,p){capturePage();active=g;page=p||groups[g][0];if(!openPages.some(x=>x.group===g&&x.name===page))openPages.push({group:g,name:page});render();let saved=pageState[g+"/"+page];if(saved)[...document.querySelectorAll("#main input,#main select,#main textarea")].forEach((e,i)=>{if(saved[i]){e.value=saved[i].value;e.checked=saved[i].checked}});}function closePage(i,event){event.stopPropagation();if(openPages.length===1)return msg("至少保留一个页面");let removed=openPages.splice(i,1)[0];if(removed.group===active&&removed.name===page){let next=openPages[Math.min(i,openPages.length-1)];nav(next.group,next.name)}else renderPageTabs();}function renderPageTabs(){document.getElementById("pageTabs").innerHTML=openPages.map((x,i)=>`<div class="page-tab ${x.group===active&&x.name===page?"selected":""}" onclick="nav('${x.group}','${x.name}')"><span>${x.name}</span><button title="关闭页面" onclick="closePage(${i},event)">×</button></div>`).join("");}function render(){renderPageTabs();document.getElementById('tabs').innerHTML=Object.keys(groups).map(g=>`<div class="tab ${g===active?'active':''}" onclick="nav('${g}')">${g}</div>`).join('');document.getElementById('sidebar').innerHTML='<div class="side-title">'+active+'</div>'+groups[active].map((p,i)=>`${active==='权限管理'&&i===0?'<div class="menu parent selected">盘口配置 <span class="arrow">⌄</span></div>':''}<div class="menu ${p===page?'active':''} ${active==='权限管理'&&i===0?'child':''}" onclick="nav('${active}','${p}')">${p}${p!==page?'<span class="arrow">›</span>':''}</div>`).join('');let body=page==='盘口列表'?partitionView():page==='发布列表'?releaseView():page==='配置中心'?configView():page==='分盘配置对比'?compareView():page==='仪表盘'?dashboard():generic();document.getElementById('main').innerHTML=`<div class="crumb">${active} / ${page==='盘口列表'?'盘口配置 / ':''}${page}</div><h1>${page}</h1><div class="muted intro">当前盘口：${scopeLabel()} · 当前身份：分盘口主账号 · 数据来源：PT01</div>${body}`}
function partitionView(){return `<div class="panel filters"><div class="field"><label>盘口名称</label><input id="filterName" placeholder="请输入盘口名称"></div><div class="field"><label>状态</label><select id="filterStatus"><option value="all">全部状态</option><option value="yes">正常</option><option value="no">停用</option></select></div><button class="btn primary" onclick="filterRows()">查询</button><button class="btn" onclick="render()">重置</button></div><div class="panel"><div class="toolbar"><button class="btn primary" onclick="editPartition(-1)">新增盘口</button><button class="btn" onclick="exportList()">导出清单</button></div><table><thead><tr><th>盘口名称</th><th>盘口编码</th><th>主账号</th><th>状态</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="rows">${partitionRows(partitions)}</tbody></table><div class="footer"><span>共 ${partitions.length} 条记录</span><div class="pages"><button class="btn">‹</button><button class="btn primary">1</button><button class="btn">›</button><select><option>10 条 / 页</option></select></div></div></div>`}function partitionRows(rows){return rows.map(p=>{let i=partitions.indexOf(p);return `<tr><td>${esc(p[0])}</td><td class="code">${esc(p[1])}</td><td><div class="code">${esc(p[2])}</div><div class="muted">${esc(p[3])}</div></td><td><span class="tag ${p[4]?'':'red'}">${p[4]?'正常':'停用'}</span></td><td>${esc(p[5])}</td><td>${p[6]}</td><td><button class="link" onclick="editPartition(${i})">编辑</button><button class="link ${p[4]?'red':''}" onclick="toggle(${i})">${p[4]?'停用':'启用'}</button></td></tr>`}).join('')}function filterRows(){let name=document.getElementById('filterName').value,status=document.getElementById('filterStatus').value;document.getElementById('rows').innerHTML=partitionRows(partitions.filter(p=>p[0].includes(name)&&(status==='all'||p[4]===(status==='yes'))))}function toggle(i){partitions[i][4]=!partitions[i][4];render();msg('盘口状态已更新（演示数据）')}function editPartition(i){let p=partitions[i]||['','','','',true,'',''];modal(i<0?'新增盘口':'编辑盘口',`<div class="field"><label>盘口名称</label><input id="pn" value="${esc(p[0])}"></div><div class="field"><label>盘口编码</label><input id="pc" value="${esc(p[1])}"></div><div class="field"><label>主账号</label><input id="po" value="${esc(p[2])}"></div><div class="field"><label>负责人</label><input id="owner" value="${esc(p[3])}"></div><div class="field"><label>备注</label><textarea id="note">${esc(p[5])}</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePartition(${i})">保存</button></div>`)}function savePartition(i){let p=[document.getElementById('pn').value.trim(),document.getElementById('pc').value.trim(),document.getElementById('po').value.trim(),document.getElementById('owner').value,true,document.getElementById('note').value,'2026-10-08 10:00'];if(!p[0]||!p[1])return msg('请填写盘口名称和编码');if(i<0)partitions.push(p);else{p[4]=partitions[i][4];partitions[i]=p}closeModal();render();msg('盘口已保存')}function exportList(){let csv='\uFEFF盘口名称,盘口编码,主账号,负责人,状态,备注\n'+partitions.map(p=>p.slice(0,6).map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='盘口清单.csv';a.click()}
function choices(ids=partitions.map(p=>p[1])){return '<div class="checks">'+partitions.filter(p=>ids.includes(p[1])).map(p=>`<label><input type="checkbox" name="target" value="${p[1]}" checked> ${p[0]}<div class="muted">${p[1]}</div></label>`).join('')+'</div>'}function selected(){return [...document.querySelectorAll('[name=target]:checked')].map(e=>e.value)}function configView(){return `<div class="notice">配置修改先保存草稿，提交到发布列表后选择本次发布盘口。未发布的盘口继续使用原版本。</div><div class="panel"><div class="toolbar"><button class="btn primary" onclick="configModal()">新增配置</button><button class="btn" onclick="nav('系统管理','分盘配置对比')">查看多盘口配置</button></div><table><thead><tr><th>配置名称</th><th>模块</th><th>目标盘口</th><th>状态</th><th>操作</th></tr></thead><tbody>${drafts.length?drafts.map((d,i)=>`<tr><td>${esc(d.name)}</td><td>${esc(d.module)}</td><td>${d.targets.length} 个盘口</td><td><span class="tag orange">草稿</span></td><td><button class="link" onclick="submitDraft(${i})">提交发布</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted" style="text-align:center">暂无草稿，点击“新增配置”开始批量配置</td></tr>'}</tbody></table></div>`}function configModal(){modal('新增批量配置',`<div class="field"><label>配置模块</label><select id="module"><option>首充活动</option><option>VIP系统</option><option>游戏厂商</option><option>支付通道</option><option>风控系统</option><option>前端更新</option></select></div><div class="field"><label>配置名称</label><input id="cn" placeholder="请输入配置名称"></div><div class="field"><label>目标盘口（可多选）</label>${choices()}</div><div class="field"><label>配置内容</label><textarea id="cv" rows="4" placeholder="例如：充值赠送比例 10%"></textarea></div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveConfig()">保存草稿</button></div>`)}function saveConfig(){let name=document.getElementById('cn').value.trim(),targets=selected();if(!name||!targets.length)return msg('请填写名称并选择目标盘口');drafts.push({name,module:document.getElementById('module').value,targets,content:document.getElementById('cv').value});closeModal();render();msg('草稿已保存，尚未生效')}function submitDraft(i){releases.unshift({...drafts[i],id:'REL-'+String(releases.length+8).padStart(3,'0'),done:[]});drafts.splice(i,1);nav('系统管理','发布列表');msg('已生成待发布单')}
function releaseView(){return `<div class="notice">每次配置修改均需发布。支持一次发布多个盘口，也可分批发布剩余盘口。</div><div class="panel"><table><thead><tr><th>发布单号</th><th>配置内容</th><th>目标盘口</th><th>已发布</th><th>状态</th><th>操作</th></tr></thead><tbody>${releases.map((r,i)=>`<tr><td class="code">${r.id}</td><td>${esc(r.name)}<div class="muted">${esc(r.module)}</div></td><td>${r.targets.length} 个</td><td>${r.done.length} / ${r.targets.length}</td><td><span class="tag ${r.done.length===r.targets.length?'':'orange'}">${r.done.length===r.targets.length?'发布完成':r.done.length?'部分发布':'待发布'}</span></td><td><button class="link" onclick="releaseModal(${i})">${r.done.length===r.targets.length?'详情':'选择盘口发布'}</button></td></tr>`).join('')}</tbody></table></div>`}function releaseModal(i){let r=releases[i],remaining=r.targets.filter(x=>!r.done.includes(x));modal('发布详情 · '+r.id,`<div class="notice">${esc(r.name)} · 已发布 ${r.done.length} / ${r.targets.length} 个盘口</div><div class="split"><div class="compare"><div class="muted">当前线上配置</div>原版本继续生效</div><div class="compare"><div class="muted">本次配置版本</div>${esc(r.content||'充值赠送比例调整为 10%')}</div></div><div class="field"><label>本次发布盘口（剩余 ${remaining.length} 个）</label>${remaining.length?choices(remaining):'<span class="tag">所有目标盘口已发布完成</span>'}</div><div class="actions"><button class="btn" onclick="closeModal()">关闭</button>${remaining.length?`<button class="btn primary" onclick="executeRelease(${i})">确认发布选中盘口</button>`:''}</div>`)}function executeRelease(i){let ids=selected();if(!ids.length)return msg('请选择本次发布盘口');releases[i].done.push(...ids);closeModal();render();msg('已成功发布 '+ids.length+' 个盘口（模拟）')}
function compareView(){return `<div class="panel"><div class="field"><label>选择同时展示的盘口</label>${choices()}</div><button class="btn primary" onclick="showCompare()">展示选中盘口</button></div><div class="panel" id="comparison"></div>`}function showCompare(){let ids=selected();document.getElementById('comparison').innerHTML=`<table><thead><tr><th>配置项</th>${ids.map(id=>'<th>'+partitions.find(p=>p[1]===id)[0]+'</th>').join('')}</tr></thead><tbody>${['首充赠送比例','VIP周奖励','支付通道状态','游戏版本'].map((x,i)=>'<tr><td>'+x+'</td>'+ids.map((id,j)=>'<td>'+(['10%','已启用','正常','v2.4.0'][i])+'</td>').join('')+'</tr>').join('')}</tbody></table>`}function dashboard(){return `<div class="stats">${[['今日充值','$ 2,846,920'],['今日提现','$ 1,128,430'],['在线用户','18,294'],['待发布配置',releases.filter(r=>r.done.length<r.targets.length).length]].map(x=>'<div class="panel"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}</div><div class="panel"><h3>快捷操作</h3><div class="toolbar"><button class="btn primary" onclick="nav('系统管理','配置中心')">批量配置</button><button class="btn" onclick="nav('系统管理','发布列表')">发布列表</button><button class="btn" onclick="nav('权限管理','盘口列表')">盘口管理</button></div></div>`}function generic(){return `<div class="panel filters"><div class="field"><label>关键词</label><input placeholder="请输入名称 / 编号"></div><div class="field"><label>盘口范围</label><select><option>全部授权盘口</option>${partitions.map(p=>'<option>'+p[0]+'</option>').join('')}</select></div><button class="btn primary" onclick="msg('已应用查询条件（演示）')">查询</button><button class="btn" onclick="render()">重置</button></div><div class="panel"><div class="toolbar"><button class="btn primary" onclick="nav('系统管理','配置中心');configModal()">新增配置</button><span class="muted">本模块配置修改后需提交发布</span></div><table><thead><tr><th>名称</th><th>所属盘口</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody><tr><td>${page}默认配置</td><td>DD04 / DD03</td><td><span class="tag">已生效</span></td><td>2026-10-08 09:30</td><td><button class="link" onclick="nav('系统管理','配置中心');configModal()">修改配置</button></td></tr></tbody></table></div>`}
document.getElementById('back').onclick=e=>{if(e.target.id==='back')closeModal()};render();

function singleAuthorizedScopes(){return [...new Set(releaseAuthorizedScopeIds())].filter(id=>partitions.some(p=>p[1]===id&&p[4]!==false))}
function singleScopeFor(r){const allowed=singleAuthorizedScopes();const preferred=r?.singlePartition||r?.targets?.find(id=>allowed.includes(id))||r?.submitScopeIds?.find(id=>allowed.includes(id));return preferred&&allowed.includes(preferred)?preferred:(allowed[0]||'')}
function choices(ids=partitions.map(p=>p[1])){const allowed=new Set(ids);return '<div class="checks">'+partitions.filter(p=>allowed.has(p[1])).map((p,i)=>`<label><input type="radio" name="target" value="${esc(p[1])}" ${i===0?'checked':''}> ${esc(p[0])}<div class="muted">${esc(p[1])}</div></label>`).join('')+'</div>'}
function selected(){return [...document.querySelectorAll('[name=target]:checked')].map(e=>e.value)}
function submitDraft(i){const d=drafts[i];if(!d)return msg('配置草稿不存在');const allowed=singleAuthorizedScopes();if(!allowed.length)return msg('当前账号没有可发布盘口权限');const scope=d.singlePartition||d.targets?.find(id=>allowed.includes(id))||allowed[0];const now=new Date().toLocaleString('sv-SE').slice(0,16);releases.unshift({...d,id:'REL-'+String(Date.now()).slice(-8),targets:[scope],singlePartition:scope,done:[],releaseState:'pending',approvalState:null,submittedAt:now,submittedBy:currentPrototypeLogin});drafts.splice(i,1);nav('系统管理','发布管理::待发布列表');msg('已提交待发布列表，请选择一个盘口直接发布')}
function submitBannerDraft(i){const d=drafts[i];if(!d||d.module!=='banner图配置')return msg('Banner 配置不存在');const allowed=singleAuthorizedScopes();if(!allowed.length)return msg('当前账号没有 Banner 发布权限');const now=new Date().toLocaleString('sv-SE').slice(0,16);releases.unshift({id:'REL-BN-'+String(Date.now()).slice(-8),configKey:d.configKey||d.bannerId||'BN-'+Date.now(),name:d.name,module:d.module,content:d.content,banner:bannerContent(d),version:d.version||1,targets:[],done:[],releaseState:'pending',approvalState:null,submitScopeIds:allowed,submittedBy:currentPrototypeLogin,submittedAt:now,sourceReleaseId:d.sourceReleaseId||null,changeType:d.sourceReleaseId?'修改':undefined});drafts.splice(i,1);nav('系统管理','发布管理::待发布列表');msg('Banner 已提交待发布列表，请选择一个盘口直接发布')}
function releaseModal(i){const r=releases[i];if(!r)return msg('发布记录不存在');const allowed=singleAuthorizedScopes();const current=r.singlePartition||r.done?.[0]||'';const options=allowed.filter(id=>!r.done?.includes(id)||id===current);if(!options.length)return msg('当前账号没有可发布盘口权限');const selectedId=current&&options.includes(current)?current:options[0];modal('发布配置 · '+esc(r.id||''),`<div class="notice"><b>${esc(r.name||'')}</b><br>本版本不经过审核，每次发布仅可选择一个有权限的盘口，发布后立即生效。</div><div class="field"><label>本次生效盘口（单选）</label><select id="singleReleaseTarget">${options.map(id=>`<option value="${esc(id)}" ${id===selectedId?'selected':''}>${esc(scopeName(id))}（${esc(id)}）</option>`).join('')}</select></div><div class="small" style="margin-top:12px">已发布：${(r.done||[]).map(scopeName).join('、')||'暂无'}</div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="executeRelease(${i})">确认发布并立即生效</button></div>`)}
function executeRelease(i){const r=releases[i],target=document.getElementById('singleReleaseTarget')?.value,allowed=singleAuthorizedScopes();if(!r||!target)return msg('请选择一个生效盘口');if(!allowed.includes(target)||partitions.find(p=>p[1]===target)?.[4]===false)return msg('所选盘口停用或超出账号权限');if((r.done||[]).includes(target))return msg('该盘口已发布');const now=new Date().toLocaleString('sv-SE').slice(0,16);r.done=[target];r.targets=[target];r.singlePartition=target;r.releaseState='published';r.approvalState=null;r.publishedAt=now;r.configKey=r.configKey||r.id;r.scopeChanges=r.scopeChanges||{};const previous=effectiveModuleConfigs.find(c=>c.key===r.configKey&&c.partition===target);const version=previous?(Number(previous.version)||1)+1:1;r.scopeChanges[target]={fromVersion:previous?.version||null,toVersion:version,beforeName:previous?.name||'',beforeContent:previous?.content??null,afterName:r.name,afterContent:r.content||'',previousReleaseId:previous?.releaseId||null};effectiveModuleConfigs=effectiveModuleConfigs.filter(c=>!(c.key===r.configKey&&c.partition===target));effectiveModuleConfigs.push({key:r.configKey,module:r.module,name:r.name,content:r.content||'',banner:r.banner,partition:target,version,releaseId:r.id,time:now});audit('单盘口发布 '+r.id+'：'+scopeName(target));closeModal();nav('系统管理','发布管理::已发布列表');msg('发布成功，配置已立即生效')}
function pendingUnifiedRows(){return releases.map((item,index)=>({kind:'release',item,index,available:singleAuthorizedScopes()})).filter(({item,available})=>available.length&&item.releaseState!=='published'&&!(item.done||[]).length)}
function pendingReleaseView(){const rows=pendingUnifiedRows(),modules=[...new Set(rows.map(x=>x.item.module).filter(Boolean))];return `<div class="pending-release-page"><div class="pending-filter"><div class="field"><label>所属模块</label><select id="pendingModuleFilter"><option value="">全部模块</option>${modules.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div><button class="btn pending-query" onclick="queryPendingReleaseRows()">查询</button></div><div class="panel pending-table-panel"><div class="wide-scroll"><table class="pending-table"><thead><tr><th>发布单号</th><th>配置内容</th><th>所属模块</th><th>提交时间</th><th>提交人</th><th>状态</th><th>操作</th></tr></thead><tbody id="pendingReleaseRows">${rows.map(({item:r,index})=>`<tr class="pending-release-row" data-module="${esc(r.module||'')}"><td class="code">${esc(r.id||'—')}</td><td class="pending-name">${esc(r.name||'—')}</td><td>${esc(r.module||'—')}</td><td>${esc(r.submittedAt||r.createdAt||'—')}</td><td>${esc(r.submittedBy||'—')}</td><td><span class="pending-status">待发布</span></td><td class="pending-actions"><button class="link" onclick="viewPendingDetail('release',${index})">查看</button><button class="link" onclick="releaseModal(${index})">发布</button><button class="link red" onclick="deletePendingRelease(${index})">删除</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">暂无待发布配置</td></tr>'}</tbody></table></div></div></div>`}
function deletePendingRelease(index){const r=releases[index];if(!r||r.releaseState==='published')return msg('发布单已处理');releases.splice(index,1);render();msg('待发布记录已删除')}
function bannerFinalRowHtml(row){const b=row.banner||{},draft=row.kind==='draft',pending=row.kind==='release',effective=row.kind==='effective',status=draft?'待发布':pending?'待发布':b.status==='hide'?'隐藏':'显示',id=esc(row.id);let actions='';if(draft)actions=`<button class="link" onclick="bannerModal(${row.draftIndex})">编辑</button><button class="link" onclick="submitBannerDraft(${row.draftIndex})">提交发布</button><button class="link red" onclick="deleteBannerDraft(${row.draftIndex})">删除</button>`;else if(pending)actions=`<button class="link" onclick="releaseModal(${releases.indexOf(row.release)})">发布</button>`;else if(effective)actions=`<button class="link" onclick="editEffectiveBanner('${esc(row.config.releaseId)}','${esc(row.partition)}')">修改</button><button class="link" onclick="closeEffectiveBanner('${esc(row.config.releaseId)}','${esc(row.partition)}')">关闭</button>`;return `<tr class="banner-list-row"><td><input class="banner-select" type="checkbox" name="bannerSelect" value="${draft?row.draftIndex:''}" ${draft?'':'disabled'}></td><td class="code">${id}</td><td>${esc(b.type||'首页Banner')}</td><td><b>${esc(b.title||row.draft?.name||row.config?.name||row.release?.name||'—')}</b></td><td>${b.image?`<img class="banner-draft-thumb" src="${esc(b.image)}" alt="封面">`:'—'}</td><td>${b.sort??'—'}</td><td>${esc(bannerAudienceLabel(b))}</td><td>${esc(bannerJumpLabel(b))}</td><td>${row.partition?esc(scopeName(row.partition)):'未选盘'}</td><td><span class="tag ${draft||pending?'orange':''}">${status}</span></td><td>${actions}</td></tr>`}
function bannerListView(){const rows=bannerListRows();return `<div class="panel"><div class="banner-list-toolbar"><div class="field"><label>标题</label><input id="bannerFilterTitle" placeholder="请输入标题"></div><div class="field"><label>类型</label><select id="bannerFilterType"><option value="">全部</option><option>首页Banner</option><option>活动Banner</option><option>游戏Banner</option></select></div><div class="field"><label>状态</label><select id="bannerFilterStatus"><option value="">全部</option><option>待发布</option><option>显示</option><option>隐藏</option></select></div><button class="btn blue" onclick="queryBannerRows()">⌕ 查询</button><button class="btn green" onclick="bannerModal()">＋ 添加Banner</button><button class="btn danger" onclick="deleteSelectedBannerDrafts()">▤ 批量删除</button></div><div class="wide-scroll"><table class="banner-table"><thead><tr><th><input type="checkbox" id="bannerSelectAll" onchange="document.querySelectorAll('#bannerTableRows [name=bannerSelect]:not(:disabled)').forEach(e=>e.checked=this.checked)"></th><th>ID</th><th>类型</th><th>标题</th><th>封面图片</th><th>排序</th><th>展示人群</th><th>跳转类型</th><th>分盘口</th><th>状态</th><th>操作</th></tr></thead><tbody id="bannerTableRows">${rows.map(bannerFinalRowHtml).join('')||'<tr><td colspan="11" class="muted">当前范围暂无 Banner 配置</td></tr>'}</tbody></table></div><div class="banner-list-note">本版本每条 Banner 发布单只绑定一个盘口，发布后立即生效。</div>${pagination(rows.length)}</div>`}
</script>

<script>

function searchPages(raw){if(!raw.trim()){document.getElementById("searchCount").textContent="";document.getElementById("searchResults").innerHTML="";return}let q=raw.trim().toLowerCase(),tokens=q.split(/\s+/).filter(Boolean);let items=Object.entries(groups).flatMap(([g,pages])=>pages.map(p=>({g,p,text:(g+' '+p+' '+(searchAliases[p]||'')).toLowerCase()})));let hits=items.filter(x=>tokens.every(t=>x.text.includes(t)||[...t].every(c=>x.text.includes(c))));hits.sort((a,b)=>(b.p.includes(raw.trim())?1:0)-(a.p.includes(raw.trim())?1:0));document.getElementById('searchCount').textContent=q?'找到 '+hits.length+' 个相关页面':'全部功能页面 · '+hits.length+' 项';document.getElementById('searchResults').innerHTML=hits.length?hits.map(x=>`<button class="search-result" onclick="searchNavigate('${x.g}','${x.p}')"><span><strong>${esc(x.p)}</strong><span class="muted">${x.g} / ${esc(x.p)}${q&&searchAliases[x.p]?' · '+esc(searchAliases[x.p]):''}</span></span><span class="go">打开页面 →</span></button>`).join(''):'<div class="search-empty">未找到相关页面，请尝试其他关键词</div>'}

<script>

function permissionSidebar(){let sections=[['盘口配置','盘口列表'],['账号管理','后台账号'],['角色配置','角色管理'],['功能菜单','功能菜单'],['日志中心','操作日志']];return '<div class="side-title">权限管理</div>'+sections.map(([title,p])=>title===p?`<div class="menu ${page===p?'active':''}" onclick="nav('权限管理','${p}')">${title}</div>`:`<div class="menu parent ${page===p?'selected':''}" onclick="nav('权限管理','${p}')">${title}<span class="arrow">⌄</span></div>${page===p?`<div class="menu child active">${p}</div>`:''}`).join('')}
function permissionFilters(fields){return `<div class="panel filters">${fields}<button class="btn primary" onclick="permissionQuery()">查询</button><button class="btn" onclick="render()">重置</button></div>`}function pf(label,id,placeholder){return `<div class="field"><label>${label}</label><input id="${id}" placeholder="${placeholder}"></div>`}function ps(){return '<div class="field"><label>状态</label><select id="permissionStatus"><option value="all">全部状态</option><option value="true">正常</option><option value="false">停用</option></select></div>'}function pagination(n){return `<div class="footer"><span>共 ${n} 条</span><div class="pages"><button class="btn primary">1</button><select><option>10 条/页</option></select></div></div>`}function scopeName(id){return partitions.find(p=>p[1]===id)?.[0]||id}function audit(action){permissionLogs.unshift({account:'dd04_owner',role:'分盘口主账号',business:page,action,time:new Date().toLocaleString('sv-SE')})}

function grantHtml(){return draftGrants.map((g,i)=>`<div class="grant-row"><select onchange="draftGrants[${i}].role=this.value">${roleData.map(r=>`<option ${r.name===g.role?'selected':''}>${esc(r.name)}</option>`).join('')}</select><button class="link red" onclick="removeGrant(${i})">移除</button><div class="grant-scopes">${partitions.map(p=>`<label><input type="checkbox" ${g.scopes.includes(p[1])?'checked':''} onchange="grantScope(${i},'${p[1]}',this.checked)"> ${p[0]}</label>`).join('')}</div></div>`).join('')}

function accountModal(i){let a=accountData[i]||{login:'',name:'',email:'',grants:[{role:'运营',scopes:[]}]};draftGrants=a.grants.map(g=>({role:g.role,scopes:[...g.scopes]}));modal(i<0?'新建账号':'编辑账号',`<div class="permission-section">① 基本信息${i>=0?'（登录名锁定）':''}</div><div class="permission-grid"><div class="field"><label>登录名 *</label><input id="accountLogin" value="${esc(a.login)}" ${i>=0?'disabled':''} placeholder="全局唯一，例如 zhangsan"></div><div class="field"><label>姓名</label><input id="accountName" value="${esc(a.name)}" placeholder="请输入姓名"></div><div class="field"><label>${i<0?'初始密码 *':'修改密码'}</label><input id="accountPassword" type="password" placeholder="至少8位，含字母与数字"></div><div class="field"><label>联系邮箱</label><input id="accountEmail" value="${esc(a.email||'')}" placeholder="选填"></div></div><div class="permission-section">② 授权配置（账号 × 盘口 × 角色）</div><div id="grantRows">${grantHtml()}</div><div class="muted">一行配置一种角色及多个盘口；不同角色请分别新增配置。</div><button class="btn" onclick="addGrant()" style="margin-top:10px">＋ 新增一行配置</button><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveAccount(${i})">${i<0?'确认':'保存变更'}</button></div>`)}
function saveAccount(i){let login=document.getElementById('accountLogin').value.trim(),pw=document.getElementById('accountPassword').value;if(!login)return msg('请填写登录名');if(i<0&&accountData.some(a=>a.login===login))return msg('登录名已存在');if((i<0||pw)&&(!/[a-z]/i.test(pw)||!/[0-9]/.test(pw)||pw.length<8))return msg('密码至少8位，含字母与数字');if(!draftGrants.length||draftGrants.some(g=>!g.scopes.length))return msg('请为每行角色选择盘口');let scopes=draftGrants.flatMap(g=>g.scopes);if(new Set(scopes).size!==scopes.length)return msg('同一盘口只能在一行中分配角色');let a={id:i<0?'A'+(1001+accountData.length):accountData[i].id,login,name:document.getElementById('accountName').value,email:document.getElementById('accountEmail').value,enabled:i<0?true:accountData[i].enabled,grants:draftGrants.map(g=>({role:g.role,scopes:[...g.scopes]}))};if(i<0)accountData.push(a);else accountData[i]=a;document.getElementById('accountPassword').value='';audit(i<0?'新建账号':'编辑账号');closeModal();render();msg('账号已保存（原型数据）')}
function bindingInfo(i){modal('授权绑定 · '+esc(accountData[i].login),'<div class="notice">此原型未连接谷歌验证器服务，绑定二维码由后台服务生成后展示。</div><div class="actions"><button class="btn" onclick="closeModal()">关闭</button></div>')}function resetBinding(i){modal('重置授权绑定',`<p>确认重置 ${esc(accountData[i].login)} 的验证器绑定？</p><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="audit('重置验证器绑定');closeModal();msg('绑定已重置（模拟）')">确认重置</button></div>`)}
function rolesView(){return permissionFilters(pf('角色名称','permissionKeyword','请输入角色名称')+ps())+`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="roleModal(-1)">新建角色</button><button class="btn" onclick="permissionExport('roles')">导出清单</button></div><table class="permission-table"><thead><tr><th>角色名称</th><th>说明</th><th>状态</th><th>操作</th></tr></thead><tbody id="permissionRows">${roleRows(roleData)}</tbody></table>${pagination(roleData.length)}</div>`}function roleRows(rows){return rows.map(r=>{let i=roleData.indexOf(r);return `<tr><td><b>${esc(r.name)}</b> ${r.builtin?'<span class="muted">内置</span>':''}</td><td>${esc(r.desc)}</td><td><span class="tag ${r.enabled?'':'red'}">${r.enabled?'正常':'停用'}</span></td><td><button class="link" onclick="roleModal(${i})">编辑权限</button><button class="link" onclick="copyRole(${i})">复制</button><button class="link red" onclick="roleData[${i}].enabled=!roleData[${i}].enabled;audit('角色状态变更');render()">${r.enabled?'停用':'启用'}</button>${r.builtin?'':`<button class="link red" onclick="deleteRole(${i})">删除</button>`}</td></tr>`}).join('')}
function permissionsTree(perms=[]){return '<div class="permission-tree">'+Object.entries(groups).map(([g,ps])=>`<details open><summary><input type="checkbox" ${perms.includes('*')||ps.every(p=>perms.includes(p))?'checked':''} onchange="this.closest('details').querySelectorAll('input').forEach(e=>e.checked=this.checked)"> 一级 Tab · ${g}</summary>${ps.map(p=>`<label><input name="rolePermission" value="${esc(p)}" type="checkbox" ${perms.includes('*')||perms.includes(p)?'checked':''}>${esc(p)}</label>`).join('')}</details>`).join('')+'</div>'}
function roleModal(i){let r=roleData[i]||{name:'',desc:'',perms:[]};modal(i<0?'新建角色':'编辑权限',`${i<0?`<div class="permission-grid"><div class="field"><label>角色名称 *</label><input id="roleName" placeholder="请输入角色名称"></div><div class="field"><label>角色说明</label><input id="roleDesc" placeholder="选填"></div></div>`:`<div class="muted">${esc(r.name)} · ${esc(r.desc)}</div>`}<div class="permission-section">权限配置</div>${permissionsTree(r.perms)}<div class="notice" style="margin-top:12px;margin-bottom:0">全局配置发布须同时满足目标盘口授权与“发布管理”权限。</div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveRole(${i})">确认</button></div>`)}function saveRole(i){let perms=[...document.querySelectorAll('[name=rolePermission]:checked')].map(e=>e.value);if(i<0){let name=document.getElementById('roleName').value.trim();if(!name||roleData.some(r=>r.name===name))return msg('角色名称不能为空或重复');roleData.push({name,desc:document.getElementById('roleDesc').value,enabled:true,perms})}else roleData[i].perms=perms;audit('保存角色权限');closeModal();render();msg('角色权限已保存')}function copyRole(i){roleData.push({...roleData[i],name:roleData[i].name+'副本'+roleData.length,builtin:false,perms:[...roleData[i].perms]});audit('复制角色');render()}function deleteRole(i){if(accountData.some(a=>a.grants.some(g=>g.role===roleData[i].name)))return msg('角色已关联账号，无法删除');roleData.splice(i,1);audit('删除角色');render()}

ups['${g}']=groups['${g}'].filter(x=>x!=='${p}');roleData.forEach(r=>r.perms=r.perms.filter(x=>x!=='${p}'));audit('删除功能');closeModal();render()">确认</button></div>`)}

<script>
// 后台账号删除：普通账号可删除，平台主账号与分盘口主账号受保护。
function isProtectedAccount(account){
  if(!account)return false;
  if(account.login==='platform_root')return true;
  return account.grants?.some(g=>{
    const role=roleByCode?.(normalizeGrant(g).roleCode)?.systemKey;
    return role==='platform_root'||role==='partition_owner'||g.role==='平台主账号'||g.role==='分盘口主账号';
  });
}
function deleteAccount(i){

  modal('删除后台账号',`<div class="notice">确认删除账号 <b>${esc(account.login)}</b>（${esc(account.name||'未填写姓名')}）？删除后该账号的盘口授权、角色绑定和登录权限将一并移除。</div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="confirmDeleteAccount(${i})">确认删除</button></div>`);
}
function confirmDeleteAccount(i){

<script>

function openPartitionSync(sourceId){
  const scope=visibleScopeIds(),configs=effectiveModuleConfigs.filter(item=>item.partition===sourceId);
  if(!scope.includes(sourceId))return msg('源盘口不在当前选择范围内');

  const summary=document.getElementById('partitionSyncSummary');

function confirmPartitionSync(sourceId){
  const targets=[...document.querySelectorAll('[name=syncTarget]:checked')].map(input=>input.value);

  if(!scope.includes(sourceId)||targets.some(id=>!scope.includes(id)||id===sourceId))return msg('同步盘口超出当前选择范围');
  if(!targets.length)return msg('请选择至少一个目标盘口');
  const source=effectiveModuleConfigs.filter(item=>item.partition===sourceId).map(item=>({...item}));
  if(!source.length)return msg('源盘口当前没有已生效配置，无法同步');

      const previous=index>=0?effectiveModuleConfigs[index]:null;
      if(index>=0){effectiveModuleConfigs.splice(index,1);overwritten++}
      const releaseId='REL-SYNC-'+Date.now().toString().slice(-8)+'-'+String(++sequence).padStart(2,'0');

<script>
const workbenchPage={group:'首页管理',name:'仪表盘'};
function normalizeWorkspaceTabs(){
  const others=openPages.filter(item=>!(item.group===workbenchPage.group&&item.name===workbenchPage.name));
  const seen=new Set();
  openPages=[workbenchPage,...others.filter(item=>{const key=item.group+'\u0000'+item.name;if(seen.has(key))return false;seen.add(key);return true})];
}
renderPageTabs=function(){
  normalizeWorkspaceTabs();
  document.getElementById('pageTabs').innerHTML=openPages.map((item,index)=>{
    const selected=item.group===active&&item.name===page;
    const label=index===0?'工作台':item.name.includes('::')?item.name.split('::').pop():item.name;
    return `<div class="page-tab ${index===0?'workbench ':''}${selected?'selected':''}" role="tab" aria-selected="${selected}" title="${esc(item.group+' / '+label)}" onclick="nav('${item.group}','${item.name}')"><span>${esc(label)}</span>${index===0?'':`<button type="button" title="关闭${esc(label)}" aria-label="关闭${esc(label)}" onclick="closePage(${index},event)">×</button>`}</div>`;
  }).join('');
  const current=document.querySelector('#pageTabs .page-tab.selected');
  if(current)current.scrollIntoView({block:'nearest',inline:'nearest'});
};
const closePageBeforeWorkspaceTabs=closePage;
closePage=function(index,event){
  if(index===0){event.stopPropagation();return}
  closePageBeforeWorkspaceTabs(index,event);
};
normalizeWorkspaceTabs();renderPageTabs();
</script>

<script>
// 个人信息指当前登录账号自身资料和密码修改，与用户查询分开。
menuHierarchy['首页管理']['个人信息']=[];
groups['首页管理']=Object.entries(menuHierarchy['首页管理']).flatMap(([name,items])=>items.length?items.map(item=>hierarchyKey(name,item)):[name]);
let currentPrototypeLogin='dd04_owner';
const loginBeforeSelfProfile=loginPrototype;
loginPrototype=function(event){
  const login=document.getElementById('loginAccount')?.value.trim();
  loginBeforeSelfProfile(event);
  if(document.getElementById('loginScreen')?.classList.contains('hidden')&&login)currentPrototypeLogin=login;
};
function selfProfileView(){
  const account=accountData.find(item=>item.login===currentPrototypeLogin);
  const displayName=account?.name||'当前账号';
  const roles=account?.grants.map(item=>item.role).filter((item,index,array)=>array.indexOf(item)===index).join('、')||'分盘口主账号';
  return `<div class="panel self-profile"><h3>当前账号信息</h3><div class="profile-summary"><div class="profile-value"><span>登录账号</span><b>${esc(currentPrototypeLogin)}</b></div><div class="profile-value"><span>显示名称</span><b>${esc(displayName)}</b></div><div class="profile-value"><span>当前角色</span><b>${esc(roles)}</b></div><div class="profile-value"><span>当前盘口范围</span><b>${esc(scopeLabel())}</b></div></div><h3>修改密码</h3><div class="muted" style="margin:-4px 0 15px">仅修改当前登录账号的密码。</div><form class="password-form" onsubmit="saveOwnPassword(event)" autocomplete="off"><div class="field"><label for="currentPassword">原密码 *</label><input id="currentPassword" type="password" autocomplete="current-password" placeholder="请输入原密码" required></div><div class="field"><label for="newPassword">新密码 *</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 8 位，包含字母和数字" required></div><div class="field"><label for="confirmPassword">确认新密码 *</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入新密码" required></div><div id="selfPasswordError" class="profile-error" role="alert"></div><div class="actions"><button class="btn primary" type="submit">保存新密码</button><button class="btn" type="reset" onclick="document.getElementById('selfPasswordError').textContent=''">重置</button></div></form><div class="notice" style="margin-top:20px;margin-bottom:0">此页面为原型演示，尚未连接真实账号认证服务；保存不会修改实际登录密码。</div></div>`;
}
function saveOwnPassword(event){
  event.preventDefault();
  const old=document.getElementById('currentPassword'),next=document.getElementById('newPassword'),again=document.getElementById('confirmPassword'),error=document.getElementById('selfPasswordError');
  error.textContent='';
  if(!old.value||!next.value||!again.value){error.textContent='请填写原密码、新密码和确认新密码';return}
  if(next.value.length<8||!/[a-z]/i.test(next.value)||!/[0-9]/.test(next.value)){error.textContent='新密码至少 8 位，且同时包含字母和数字';return}
  if(next.value===old.value){error.textContent='新密码不能与原密码相同';return}
  if(next.value!==again.value){error.textContent='两次输入的新密码不一致';return}
  event.target.reset();
  msg('密码修改流程验证通过（原型演示，未修改真实密码）');
}

<script>
// 权限原型：角色类型、不可变主账号、指定源盘口的模块同步及账号删除范围。
const seniorRole={code:nextRoleCode(),name:'高级管理员',desc:'内置账号专用 · 全部盘口与全部功能权限',enabled:true,builtin:true,systemKey:'senior_admin',roleType:'platform',sourceAccount:'platform_root',perms:['*'],visibleScopes:partitions.map(p=>p[1])};
roleData.push(seniorRole);
accountData.push({id:'A'+(1001+accountData.length),login:'senior_admin',name:'高级管理员',enabled:true,builtin:true,grants:[{role:seniorRole.name,roleCode:seniorRole.code,scopes:partitions.map(p=>p[1])}]});
roleData.forEach(r=>{if(!r.roleType)r.roleType=r.systemKey==='platform_root'?'platform':'partition';if(r.roleType==='platform')r.visibleScopes=partitions.map(p=>p[1])});
function allScopeIds(){return partitions.map(p=>p[1])}
function availableRoleScopes(r){return r?.roleType==='platform'?allScopeIds():(r?.visibleScopes||[])}
function currentOperator(){return accountData.find(a=>a.login===currentPrototypeLogin)}
function accountScopes(a){return [...new Set((a?.grants||[]).flatMap(g=>g.scopes||[]))].sort()}
function currentOperatorScopes(){const a=currentOperator();return a?.login==='platform_root'||a?.login==='senior_admin'?allScopeIds().sort():accountScopes(a)}
function hasAccountDeletePermission(){const a=currentOperator();if(!a||!a.enabled)return false;if(['platform_root','senior_admin'].includes(a.login))return true;return a.grants.some(g=>{const r=roleByCode(normalizeGrant(g).roleCode);return r?.systemKey==='partition_owner'||r?.perms?.includes('*')||r?.perms?.some(p=>['后台账号','账号管理','账号删除','删除账号'].includes(p))})}
function canDeleteAccount(a){return !!a&&!isProtectedAccount(a)&&hasAccountDeletePermission()&&JSON.stringify(accountScopes(a))===JSON.stringify(currentOperatorScopes())}
const protectedAccountBeforeSenior=isProtectedAccount;
isProtectedAccount=function(a){return !!a&&(a.login==='senior_admin'||protectedAccountBeforeSenior(a))};
const accountModalBeforeSenior=accountModal;
accountModal=function(i){if(accountData[i]?.login==='senior_admin')return msg('内置高级管理员账号不可修改');accountModalBeforeSenior(i);if(i>=0){draftGrants.forEach((g,n)=>{const saved=accountData[i]?.grants[n];if(saved?.roleCode){g.roleCode=saved.roleCode;g.role=roleByCode(saved.roleCode)?.name||saved.role}});const holder=document.getElementById('grantRows');if(holder)holder.innerHTML=grantHtml()}};
const saveAccountBeforeSenior=saveAccount;

const deleteAccountBeforeScope=deleteAccount;
deleteAccount=function(i){const a=accountData[i];if(!a)return;if(isProtectedAccount(a))return msg('内置账号及主账号不可删除');if(!hasAccountDeletePermission())return msg('当前账号没有账号删除权限');if(!canDeleteAccount(a))return msg('该账号不在可删除范围内');return deleteAccountBeforeScope(i)};
const confirmDeleteAccountBeforeScope=confirmDeleteAccount;
confirmDeleteAccount=function(i){const a=accountData[i];if(!a||!hasAccountDeletePermission()||!canDeleteAccount(a))return closeModal(),msg('该账号不在可删除范围内');return confirmDeleteAccountBeforeScope(i)};

function bannerModal(i=-1){bannerEditing=i;const source=drafts[i],b=bannerContent(source)||{title:'',type:'首页Banner',sort:'',image:'',audience:'all',audienceValue:'',jump:'none',jumpTarget:'',status:'show'};bannerImageData=b.image||'';modal(i<0?'添加Banner':'编辑Banner',`<div class="banner-editor-body"><div class="banner-form-row"><label for="bannerTitle" class="required">标题</label><input id="bannerTitle" class="banner-title" type="text" value="${esc(b.title||'')}" placeholder="请输入标题"></div><div class="banner-form-row"><label for="bannerType" class="required">类型</label><select id="bannerType" class="banner-short"><option ${b.type==='首页Banner'?'selected':''}>首页Banner</option><option ${b.type==='活动Banner'?'selected':''}>活动Banner</option><option ${b.type==='游戏Banner'?'selected':''}>游戏Banner</option></select></div><div class="banner-form-row"><label for="bannerSort" class="required">排序</label><input id="bannerSort" class="banner-short" type="number" min="0" step="1" value="${esc(b.sort)}" placeholder="数字越小越靠前"></div><div class="banner-form-row"><label class="required">封面图片</label><div><label class="banner-upload" title="选择封面图片"><span id="bannerImagePreview">${b.image?`<img src="${esc(b.image)}" alt="Banner 封面预览">`:'＋'}</span><input id="bannerImage" type="file" accept="image/*" onchange="bannerImageChosen(this)"></label><span class="banner-dim">建议尺寸：686 × 210</span></div></div><div class="banner-form-row"><label>展示人群</label><div><div class="banner-radio-group">${[['all','全部，剔除用户标签'],['tag','指定用户标签'],['uids','指定UID'],['bulk','批量导入UID']].map(([value,label])=>`<label><input type="radio" name="bannerAudience" value="${value}" ${b.audience===value?'checked':''} onchange="bannerAudienceChanged()">${label}</label>`).join('')}</div><div id="bannerAudienceExtra" class="banner-audience-extra"></div></div></div><div class="banner-form-row"><label for="bannerJump" class="required">跳转类型</label><div><select id="bannerJump" class="banner-short" onchange="bannerJumpChanged()"><option value="none" ${b.jump==='none'?'selected':''}>不跳转</option><option value="page" ${b.jump==='page'?'selected':''}>站内页面</option><option value="activity" ${b.jump==='activity'?'selected':''}>活动</option><option value="game" ${b.jump==='game'?'selected':''}>游戏</option><option value="external" ${b.jump==='external'?'selected':''}>外部链接</option></select><div id="bannerJumpExtra"></div></div></div><div class="banner-form-row"><label class="required">状态</label><div class="banner-radio-group"><label><input type="radio" name="bannerStatus" value="show" ${b.status==='show'?'checked':''}>显示</label><label><input type="radio" name="bannerStatus" value="hide" ${b.status==='hide'?'checked':''}>隐藏</label></div></div><div class="actions banner-actions"><button class="btn primary" onclick="saveBanner()">确定</button><button class="btn" onclick="closeModal()">取消</button></div></div>`);document.getElementById('modal').classList.add('banner-editor');bannerAudienceChanged();bannerJumpChanged();const av=document.getElementById('bannerAudienceValue'),jt=document.getElementById('bannerJumpTarget');if(av)av.value=b.audienceValue||'';if(jt)jt.value=b.jumpTarget||''}
function saveBanner(){const title=document.getElementById('bannerTitle')?.value.trim(),type=document.getElementById('bannerType')?.value,sortText=document.getElementById('bannerSort')?.value.trim(),audience=document.querySelector('input[name="bannerAudience"]:checked')?.value||'all',audienceValue=document.getElementById('bannerAudienceValue')?.value.trim()||'',jump=document.getElementById('bannerJump')?.value,jumpTarget=document.getElementById('bannerJumpTarget')?.value.trim()||'',status=document.querySelector('input[name="bannerStatus"]:checked')?.value||'show';if(!title)return msg('请填写标题');if(!/^\d+$/.test(sortText))return msg('排序须为非负整数');if(!bannerImageData)return msg('请上传封面图片');if(audience!=='all'&&!audienceValue)return msg('请填写或选择展示人群');if(jump!=='none'&&!jumpTarget)return msg('请填写跳转目标');if(jump==='external'&&!/^https:\/\//i.test(jumpTarget))return msg('外部链接须以 https:// 开头');const banner={title,type,sort:Number(sortText),image:bannerImageData,audience,audienceValue,jump,jumpTarget,status},previous=drafts[bannerEditing],item={...(previous||{}),name:title,module:'banner图配置',content:JSON.stringify(banner),banner,targets:[],createdAt:new Date().toLocaleString('sv-SE').slice(0,16)};if(bannerEditing<0)drafts.push(item);else drafts[bannerEditing]=item;audit(bannerEditing<0?'新增Banner配置':'编辑Banner配置');closeModal();render();msg('Banner 已保存为待发布配置')}
function submitBannerDraft(i){const d=drafts[i];if(!d||d.module!=='banner图配置')return msg('Banner 配置不存在');const submitScopeIds=submissionScopeSnapshot(d.module);if(!submitScopeIds.length)return msg('当前账号没有 Banner 配置权限');const now=new Date().toLocaleString('sv-SE').slice(0,16);releases.unshift({id:'REL-'+Date.now().toString().slice(-8),configKey:d.configKey||d.bannerId||'BANNER-'+Date.now().toString().slice(-8),name:d.name,module:d.module,content:d.content,banner:bannerContent(d),version:d.version||1,sourceReleaseId:d.sourceReleaseId||null,changeType:d.sourceReleaseId?'修改':undefined,targets:[],done:[],releaseState:'pending',createdAt:now,submittedAt:now,submittedBy:currentPrototypeLogin,submitScopeIds});drafts.splice(i,1);if(pendingAvailableScopeIds(releases[0]).length)nav('系统管理','发布管理::待发布列表');else render();msg('Banner 已进入待发布列表，等待有权限的人员发布')}
const moduleConfigViewBeforeBanner=moduleConfigView;
moduleConfigView=function(){if(page.split('::').pop()!=='banner图配置')return moduleConfigViewBeforeBanner();const rows=drafts.filter(d=>d.module==='banner图配置'),effective=effectiveModuleConfigs.filter(c=>c.module==='banner图配置'&&visibleScopeIds().includes(c.partition));return `<div class="notice">在此配置 Banner 内容；保存后进入待发布列表，由发布管理选择生效盘口。</div><div class="panel"><div class="toolbar"><button class="btn primary" onclick="bannerModal()">＋ 添加Banner</button><button class="btn" onclick="nav('系统管理','发布管理::待发布列表')">查看待发布列表</button></div><div class="wide-scroll"><table><thead><tr><th>封面</th><th>标题</th><th>类型与规则</th><th>状态</th><th>保存时间</th><th>操作</th></tr></thead><tbody>${rows.map(d=>{const i=drafts.indexOf(d),b=bannerContent(d);return `<tr><td>${b?.image?`<img class="banner-draft-thumb" src="${esc(b.image)}" alt="封面">`:'—'}</td><td><b>${esc(d.name)}</b></td><td>${b?esc(bannerSummary(b)):'—'}</td><td><span class="tag orange">待发布</span></td><td>${esc(d.createdAt||'—')}</td><td><button class="link" onclick="bannerModal(${i})">编辑</button><button class="link" onclick="submitBannerDraft(${i})">进入发布</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">暂无待发布 Banner，点击“添加Banner”创建</td></tr>'}</tbody></table></div></div><div class="panel"><div class="overview-head"><h3>当前生效 Banner</h3><span class="muted">按顶部选中盘口展示</span></div><div class="wide-scroll"><table><thead><tr><th>封面</th><th>标题</th><th>生效盘口</th><th>状态</th><th>版本</th><th>发布时间</th></tr></thead><tbody>${effective.map(c=>{const b=bannerContent(c);return `<tr><td>${b?.image?`<img class="banner-draft-thumb" src="${esc(b.image)}" alt="封面">`:'—'}</td><td>${esc(c.name)}</td><td>${esc(scopeName(c.partition))}</td><td>${b?.status==='hide'?'隐藏':'显示'}</td><td>V${esc(c.version)}</td><td>${esc(c.time)}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted">当前选中盘口暂无已生效 Banner</td></tr>'}</tbody></table></div></div>`};
render();
</script>
<style>
.banner-list-toolbar{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:12px}.banner-list-toolbar .field{margin:0}.banner-list-toolbar .field input,.banner-list-toolbar .field select{width:168px;min-height:34px}.banner-list-toolbar .btn{white-space:nowrap}.banner-list-toolbar .green{background:#13c884;border-color:#13c884;color:#fff}.banner-list-toolbar .amber{background:#ffba08;border-color:#ffba08;color:#fff}.banner-list-toolbar .blue{background:#268bff;border-color:#268bff;color:#fff}.banner-list-toolbar .danger{background:#f35561;border-color:#f35561;color:#fff}.banner-table{min-width:1100px}.banner-table th{text-align:center;white-space:nowrap}.banner-table td{text-align:center}.banner-table .banner-title-cell{text-align:left}.banner-table .banner-title-cell b{display:block}.banner-table .banner-select{width:auto}.banner-table .banner-row-actions{white-space:nowrap}.banner-table .banner-row-actions .link{margin:0 2px}.banner-table .banner-scope{display:inline-block;padding:3px 8px;border-radius:4px;background:#eef2ff;color:#4b59af;font-weight:600}.banner-table .banner-state{white-space:nowrap}.banner-list-note{font-size:12px;color:#8a91a4;margin:8px 0 0}.banner-approval-table{min-width:900px}
</style>
<script>
// Banner 列表按分盘口逐行展示；预发布选盘，审批通过后自动逐盘生效。
function bannerReleaseRows(){return releases.filter(r=>r.module==='banner图配置'&&r.bannerApproval).flatMap(r=>r.targets.filter(id=>visibleScopeIds().includes(id)).map(id=>({release:r,partition:id})))}
function bannerState(r){return r.approvalState==='pending'?'待审批':r.approvalState==='rejected'?'已驳回':r.approvalState==='approved'?'已生效':'待预发布'}
function bannerListRows(){const result=[];drafts.forEach((d,i)=>{if(d.module==='banner图配置')result.push({kind:'draft',id:d.bannerId||`草稿-${i+1}`,draft:d,draftIndex:i,banner:bannerContent(d),partition:null})});bannerReleaseRows().filter(x=>x.release.approvalState!=='approved'&&x.release.approvalState!=='rejected').forEach(({release,partition})=>result.push({kind:'release',id:release.id,release,banner:bannerContent(release),partition}));effectiveModuleConfigs.filter(c=>c.module==='banner图配置'&&visibleScopeIds().includes(c.partition)).forEach(c=>result.push({kind:'effective',id:c.key||c.releaseId,config:c,banner:bannerContent(c),partition:c.partition}));return result}
function bannerAudienceLabel(b){return {all:'全部，剔除用户标签',exclude:'剔除用户标签',tag:'指定用户标签',uids:'指定UID',bulk:'批量导入UID'}[b?.audience]||'—'}
function bannerJumpLabel(b){return {none:'不跳转',page:'站内页面',activity:'活动',game:'游戏',external:'外部链接'}[b?.jump]||'—'}
function bannerAuthorizedScopes(){return visibleScopeIds().filter(id=>submissionScopeSnapshot('banner图配置').includes(id))}
function bannerCanApprove(){const account=currentOperator();if(!account?.enabled)return false;if(['platform_root','senior_admin'].includes(account.login))return true;return account.grants.some(g=>{const role=roleByCode(normalizeGrant(g).roleCode);return role?.systemKey==='partition_owner'||role?.perms?.includes('*')||role?.perms?.some(p=>p.includes('发布管理'))})}
function bannerRowHtml(row){const b=row.banner||{},draft=row.kind==='draft',pending=row.kind==='release',status=draft?'待发布':pending?bannerState(row.release):b.status==='hide'?'隐藏':'显示',id=esc(row.id);return `<tr class="banner-list-row" data-title="${esc(b.title||row.draft?.name||row.config?.name||row.release?.name||'')}" data-type="${esc(b.type||'')}" data-status="${esc(status)}"><td><input class="banner-select" type="checkbox" name="bannerSelect" value="${draft?row.draftIndex:''}" ${draft?'':'disabled'} aria-label="选择${id}"></td><td class="code">${id}</td><td>${esc(b.type||'首页Banner')}</td><td class="banner-title-cell"><b>${esc(b.title||row.draft?.name||row.config?.name||row.release?.name||'—')}</b>${pending?`<span class="muted">${esc(row.release.id)}</span>`:''}</td><td>${b.image?`<img class="banner-draft-thumb" src="${esc(b.image)}" alt="封面">`:'—'}</td><td>${b.sort??'—'}</td><td>${esc(bannerAudienceLabel(b))}</td><td>${esc(bannerJumpLabel(b))}</td><td>${row.partition?`<span class="banner-scope">${esc(scopeName(row.partition))}</span>`:'<span class="muted">未选盘</span>'}</td><td class="banner-state"><span class="tag ${draft||pending?'orange':''}">${esc(status)}</span></td><td class="banner-row-actions">${draft?`<button class="link" onclick="bannerModal(${row.draftIndex})">编辑</button><button class="link red" onclick="deleteBannerDraft(${row.draftIndex})">删除</button>`:pending?`<button class="link" onclick="reviewBannerRelease('${esc(row.release.id)}')">${row.release.approvalState==='pending'?'审批':'查看'}</button>`:`<button class="link" onclick="editEffectiveBanner('${esc(row.config.releaseId)}','${esc(row.partition)}')">修改</button>`}</td></tr>`}
function bannerListView(){const rows=bannerListRows();return `<div class="panel"><div class="banner-list-toolbar"><div class="field"><label>标题</label><input id="bannerFilterTitle" placeholder="请输入标题"></div><div class="field"><label>类型</label><select id="bannerFilterType"><option value="">全部</option><option>首页Banner</option><option>活动Banner</option><option>游戏Banner</option></select></div><div class="field"><label>状态</label><select id="bannerFilterStatus"><option value="">全部</option><option>待发布</option><option>待审批</option><option>显示</option><option>隐藏</option></select></div><button class="btn blue" onclick="queryBannerRows()">⌕ 查询</button><button class="btn green" onclick="bannerModal()">＋ 添加Banner</button><button class="btn amber" onclick="prepublishBanner()">◉ 预发布</button><button class="btn blue" onclick="bannerPrepublishRecords()">▤ 预发布记录</button><button class="btn danger" onclick="deleteSelectedBannerDrafts()">▤ 批量删除</button></div><div class="wide-scroll"><table class="banner-table"><thead><tr><th><input type="checkbox" id="bannerSelectAll" onchange="document.querySelectorAll('#bannerTableRows [name=bannerSelect]:not(:disabled)').forEach(e=>e.checked=this.checked)"></th><th>ID</th><th>类型</th><th>标题</th><th>封面图片</th><th>排序</th><th>展示人群</th><th>跳转类型</th><th>分盘口</th><th>状态</th><th>操作</th></tr></thead><tbody id="bannerTableRows">${rows.map(bannerRowHtml).join('')||'<tr><td colspan="11" class="muted">当前范围暂无 Banner 配置</td></tr>'}</tbody></table></div><div class="banner-list-note">未发布配置不绑定盘口；预发布时选择目标盘口。多选盘口时，每个盘口的配置单独成行。</div>${pagination(rows.length)}</div>`}
function queryBannerRows(){const title=document.getElementById('bannerFilterTitle')?.value.trim().toLowerCase()||'',type=document.getElementById('bannerFilterType')?.value||'',status=document.getElementById('bannerFilterStatus')?.value||'';document.querySelectorAll('#bannerTableRows .banner-list-row').forEach(tr=>{tr.hidden=!!(title&&!tr.dataset.title.toLowerCase().includes(title)||type&&tr.dataset.type!==type||status&&tr.dataset.status!==status)})}
function selectedBannerDraftIndexes(){return [...document.querySelectorAll('#bannerTableRows [name=bannerSelect]:checked')].map(e=>Number(e.value)).filter(i=>Number.isInteger(i)&&drafts[i]?.module==='banner图配置')}
function deleteBannerDraft(i){if(drafts[i]?.module!=='banner图配置')return msg('仅可删除未发布的 Banner 草稿');drafts.splice(i,1);audit('删除Banner草稿');render();msg('草稿已删除')}
function deleteSelectedBannerDrafts(){const ids=selectedBannerDraftIndexes();if(!ids.length)return msg('请选择待预发布的 Banner 草稿');modal('批量删除 Banner 草稿',`<div class="notice">将删除 ${ids.length} 条未发布草稿。已提交审批及已生效配置不会删除。</div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="confirmDeleteBannerDrafts('${ids.join(',')}')">确认删除</button></div>`)}
function confirmDeleteBannerDrafts(encoded){const ids=encoded.split(',').map(Number).sort((a,b)=>b-a);ids.forEach(i=>{if(drafts[i]?.module==='banner图配置')drafts.splice(i,1)});audit('批量删除Banner草稿');closeModal();render();msg('选中草稿已删除')}
function prepublishBanner(){const ids=selectedBannerDraftIndexes();if(!ids.length)return msg('请先勾选至少一条待预发布 Banner');const options=partitions.filter(p=>bannerAuthorizedScopes().includes(p[1]));modal('Banner 预发布',`<div class="notice">已选择 ${ids.length} 条 Banner。选定目标盘口后提交审批；审批通过即自动生效。</div><div class="permission-section">本次目标分盘口 *</div><div class="checks">${options.map(p=>`<label><input type="checkbox" name="bannerReleaseTarget" value="${p[1]}"> ${esc(p[0])}</label>`).join('')}</div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitBannerApproval('${ids.join(',')}')">提交审批</button></div>`)}
function submitBannerApproval(encoded){const ids=encoded.split(',').map(Number),targets=[...document.querySelectorAll('#modal [name=bannerReleaseTarget]:checked')].map(e=>e.value);if(!targets.length)return msg('请至少选择一个生效分盘口');if(targets.some(id=>!bannerAuthorizedScopes().includes(id)))return msg('目标分盘口超出当前账号权限范围');const items=ids.map(i=>drafts[i]);if(items.some(d=>!d||d.module!=='banner图配置'))return msg('草稿已变化，请重新选择');const now=new Date().toLocaleString('sv-SE').slice(0,16);items.forEach((d,n)=>releases.unshift({id:'REL-BN-'+Date.now().toString().slice(-7)+'-'+n,configKey:d.configKey||d.bannerId||'BN-'+Date.now()+'-'+n,name:d.name,module:'banner图配置',content:d.content,version:d.version||1,targets:[...targets],done:[],releaseState:'pending_approval',approvalState:'pending',submittedBy:currentPrototypeLogin,submittedAt:now,bannerApproval:true,sourceReleaseId:d.sourceReleaseId||null,changeType:d.sourceReleaseId?'修改':undefined}));ids.sort((a,b)=>b-a).forEach(i=>drafts.splice(i,1));audit('提交Banner预发布审批');closeModal();render();msg('已提交审批，审批通过后自动生效')}
function bannerPrepublishRecords(){const records=releases.filter(r=>r.bannerApproval),visible=records.filter(r=>r.targets.some(id=>visibleScopeIds().includes(id)));modal('Banner 预发布记录',`<div class="wide-scroll"><table class="banner-approval-table"><thead><tr><th>发布单号</th><th>标题</th><th>目标分盘口</th><th>审批状态</th><th>提交人</th><th>操作</th></tr></thead><tbody>${visible.map(r=>`<tr><td class="code">${esc(r.id)}</td><td>${esc(r.name)}</td><td>${r.targets.filter(id=>visibleScopeIds().includes(id)).map(id=>esc(scopeName(id))).join('、')}</td><td>${bannerState(r)}</td><td>${esc(r.submittedBy||'—')}</td><td><button class="link" onclick="reviewBannerRelease('${esc(r.id)}')">查看 / 审批</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">暂无预发布记录</td></tr>'}</tbody></table></div><div class="actions"><button class="btn" onclick="closeModal()">关闭</button></div>`)}
function reviewBannerRelease(id){const r=releases.find(x=>x.id===id&&x.bannerApproval);if(!r||!pendingAvailableScopeIds(r).length)return msg('该发布申请不在当前账号的审核范围内');const b=bannerContent(r),pending=r.approvalState==='pending';modal('Banner 审批 · '+esc(r.id),`<div class="notice">${esc(r.name)} · ${esc(bannerState(r))}<br>目标分盘口：${r.targets.map(id=>esc(scopeName(id))).join('、')}<br>提交人：${esc(r.submittedBy||'—')}</div><div class="field"><label>配置内容</label><div class="compare">${esc(bannerSummary(b))}</div></div>${pending?'<div class="field"><label>审批意见</label><textarea id="bannerApprovalComment" rows="3" placeholder="驳回时必填"></textarea></div>':''}<div class="actions"><button class="btn" onclick="closeModal()">关闭</button>${pending?`<button class="btn danger" onclick="rejectBannerRelease('${esc(id)}')">驳回</button><button class="btn primary" onclick="approveBannerRelease('${esc(id)}')">通过并自动生效</button>`:''}</div>`)}
function approveBannerRelease(id){const r=releases.find(x=>x.id===id&&x.bannerApproval);if(!r||r.approvalState!=='pending')return msg('申请已处理');if(!pendingAvailableScopeIds(r).length)return msg('该发布申请不在当前账号的审核范围内');if(r.targets.some(target=>!releaseAuthorizedScopeIds().includes(target)))return msg('目标分盘口超出当前账号的发布权限范围');const now=new Date().toLocaleString('sv-SE').slice(0,16);r.approvalState='approved';r.approvedBy=currentPrototypeLogin;r.approvedAt=now;r.approvalComment=document.getElementById('bannerApprovalComment')?.value.trim()||'';r.selfApproved=r.submittedBy===currentPrototypeLogin;r.releaseState='published';r.done=[...r.targets];r.publishedAt=now;r.scopeChanges=r.scopeChanges||{};r.targets.forEach(id=>{const previous=effectiveModuleConfigs.find(c=>c.partition===id&&c.key===r.configKey);const version=previous?(Number(previous.version)||1)+1:1;r.scopeChanges[id]={fromVersion:previous?.version||null,toVersion:version,beforeName:previous?.name||'',beforeContent:previous?.content??null,afterName:r.name,afterContent:r.content||'',previousReleaseId:previous?.releaseId||null};effectiveModuleConfigs=effectiveModuleConfigs.filter(c=>!(c.partition===id&&c.key===r.configKey));effectiveModuleConfigs.push({key:r.configKey,module:r.module,name:r.name,content:r.content,partition:id,version,releaseId:r.id,time:now})});audit('审批通过并自动发布Banner '+r.id);closeModal();render();msg('审批通过，Banner 已在所选盘口生效')}

<script>
// 发布权限按账号在各盘口绑定的角色计算；提交时单独记录配置归属范围。
function releaseAuthorizedScopeIds(){
  const account=currentOperator();
  const enabled=partitions.filter(p=>p[4]!==false).map(p=>p[1]);
  if(!account?.enabled)return [];
  const platformOwner=account.login==='platform_root'||account.login==='senior_admin'||(account.grants||[]).some(g=>{const role=roleByCode(normalizeGrant(g).roleCode);return role?.systemKey==='platform_root'||role?.systemKey==='senior_admin'||g.role==='平台主账号'||g.role==='高级管理员'});
  if(platformOwner)return enabled;
  return [...new Set((account.grants||[]).flatMap(g=>{
    const role=roleByCode(normalizeGrant(g).roleCode);
    const allowed=role?.enabled&&(role.systemKey==='partition_owner'||role.perms?.includes('*')||role.perms?.some(p=>p.includes('发布管理')||p.includes('待发布列表')));
    return allowed?g.scopes||[]:[];
  }))].filter(id=>enabled.includes(id));
}
function submissionScopeSnapshot(module){
  const account=currentOperator();
  if(!account?.enabled)return [];
  const enabled=partitions.filter(p=>p[4]!==false).map(p=>p[1]);
  if(['platform_root','senior_admin'].includes(account.login))return enabled;
  return [...new Set((account.grants||[]).flatMap(g=>{
    const role=roleByCode(normalizeGrant(g).roleCode);
    if(!role?.enabled)return [];
    const perms=role.perms||[];
    const canConfigure=role.systemKey==='partition_owner'||perms.includes('*')||perms.some(p=>p===module||p.endsWith('::'+module)||(module==='banner图配置'&&p==='Banner / 拍脸图'));
    return canConfigure?g.scopes||[]:[];
  }))].filter(id=>enabled.includes(id));
}
function releaseSourceScopeIds(item){
  if(!item)return [];
  if(Array.isArray(item.submitScopeIds))return item.submitScopeIds;
  const submitter=accountData.find(a=>a.login===(item.submittedBy||item.createdBy));
  if(submitter)return accountScopes(submitter);
  return item.targets?.length?item.targets:[];
}
function platformCanPublishAllScopes(){
  const account=currentOperator();
  if(!account?.enabled)return false;
  return ['platform_root','senior_admin'].includes(account.login)||(account.grants||[]).some(g=>{
    const role=roleByCode(normalizeGrant(g).roleCode);
    return role?.systemKey==='platform_root'||role?.systemKey==='senior_admin';
  });
}
function pendingAvailableScopeIds(item){
  if(!item)return [];
  const source=releaseSourceScopeIds(item),reviewer=releaseAuthorizedScopeIds();
  if(!source.some(id=>reviewer.includes(id)))return [];
  return reviewer.filter(id=>!item.targets?.length||item.targets.includes(id));
}
render();
</script>

<script>

function versionContentObject(raw){

}
function versionFieldValue(key,value){

  if(key==='status')return value==='hide'?'隐藏':value==='show'?'显示':String(value);
  if(typeof value==='object')return JSON.stringify(value);
  return String(value);
}
function versionChangedFields(snapshot){
  const before=snapshot.beforeContent,after=snapshot.afterContent;
  const result=[];
  if(snapshot.beforeName!==snapshot.afterName)result.push({label:'配置名称',before:snapshot.beforeName||'—',after:snapshot.afterName||'—'});
  const oldObject=versionContentObject(before),newObject=versionContentObject(after);
  if(newObject&&(oldObject||before===null)){
    const labels={title:'标题',type:'类型',sort:'排序',image:'封面图片',audience:'展示人群',audienceValue:'人群条件',jump:'跳转类型',jumpTarget:'跳转目标',status:'状态'};
    const keys=[...new Set([...Object.keys(oldObject||{}),...Object.keys(newObject)])];
    keys.forEach(key=>{
      const oldValue=oldObject?.[key],newValue=newObject[key];
      if(JSON.stringify(oldValue)===JSON.stringify(newValue))return;
      result.push({label:labels[key]||key,before:versionFieldValue(key,oldValue),after:versionFieldValue(key,newValue),beforeImage:key==='image'?oldValue:null,afterImage:key==='image'?newValue:null});
    });

}
function versionSnapshotForScope(r,id){

<script>

function republishEffective(releaseId,sourcePartition){
  const source=effectiveModuleConfigs.find(c=>c.releaseId===releaseId&&c.partition===sourcePartition);
  if(!source)return msg('当前生效配置不存在');
  const options=partitions.filter(p=>p[4]!==false&&releaseAuthorizedScopeIds().includes(p[1])&&!effectiveModuleConfigs.some(c=>c.key===source.key&&c.partition===p[1]));

function confirmRepublishEffective(releaseId,sourcePartition){
  const source=effectiveModuleConfigs.find(c=>c.releaseId===releaseId&&c.partition===sourcePartition);
  if(!source)return msg('来源配置已变化，请刷新后重试');
  const authorized=releaseAuthorizedScopeIds();
  if(!authorized.some(id=>partitions.find(p=>p[1]===id)?.[4]!==false&&!effectiveModuleConfigs.some(c=>c.key===source.key&&c.partition===id)))return msg('当前没有可新增的盘口');
  const now=new Date().toLocaleString('sv-SE').slice(0,16),id='REL-'+Date.now().toString().slice(-8)+'-'+Math.random().toString(36).slice(2,5);
  const next={id,configKey:source.key,module:source.module,name:source.name,content:source.content||'',banner:source.module==='banner图配置'?bannerContent(source):undefined,sourceReleaseId:releaseId,sourcePartition,changeType:'新增盘口',addPartitionOnly:true,targets:[],done:[],releaseState:'pending',approvalState:null,submittedAt:now,submittedBy:currentPrototypeLogin,submitScopeIds:[...authorized],scopeChanges:{}};
  releases.unshift(next);audit('提交新增盘口申请 '+releaseId);nav('系统管理','发布管理::待发布列表');msg('已生成待发布记录，请在待发布列表选择新增盘口');
}
const releaseModalBeforeAddPartition=releaseModal;
releaseModal=function(i){
  const r=releases[i];if(!r?.addPartitionOnly)return releaseModalBeforeAddPartition(i);
  if(!pendingAvailableScopeIds(r).length)return msg('该发布单不在当前账号的发布范围内');
  const allowed=pendingAvailableScopeIds(r),candidateIds=partitions.filter(p=>p[4]!==false&&allowed.includes(p[1])).map(p=>p[1]);

<script>
// 短信接口支持按分盘多厂商配置；每个厂商分别保存参数。
const smsProviderDefinitions=[
  {id:'kmi',name:'KMI',fields:[['CLOUDKMI_APP_KEY','APP KEY'],['CLOUDKMI_APP_SECRET','APP SECRET']]},
  {id:'lingliang',name:'领量',fields:[['ITNIOTECH_APP_ID','APP ID'],['ITNIOTECH_APP_KEY','APP KEY'],['ITNIOTECH_APP_SECRET','APP SECRET']]},
  {id:'cloudxm',name:'CloudXM',fields:[['CLOUDXM_APP_ID','APP ID'],['CLOUDXM_APP_KEY','APP KEY'],['CLOUDXM_APP_SECRET','APP SECRET']]},
  {id:'msg91',name:'MSG91',fields:[['MSG91_AUTH_KEY','AUTH KEY'],['MSG91_SENDER_ID','SENDER ID']]}
];
const partitionSmsProviders={};
let smsEditingPartition='',smsSelectedProviders=new Set(),smsDraftValues={};
const modalBeforeSmsProviders=modal;
modal=function(title,html){document.getElementById('modal').classList.remove('sms-provider-editor');modalBeforeSmsProviders(title,html)};
function smsProviderData(code){
  if(partitionSmsProviders[code])return partitionSmsProviders[code];
  const old=partitionBusinessSettings[code]||{},name=String(old.smsProvider||'').toLowerCase();
  const matched=smsProviderDefinitions.find(item=>item.name.toLowerCase()===name||item.id===name);
  if(!matched)return {selected:[],values:{}};
  const values={};
  if(matched.id==='kmi')values.kmi={CLOUDKMI_APP_KEY:old.smsKeyId||'',CLOUDKMI_APP_SECRET:old.smsSecret||''};
  return {selected:[matched.id],values};
}
function smsProviderCard(def,values={}){
  return `<div class="sms-provider-card"><h3>${esc(def.name)}</h3>${def.fields.map(([key,label])=>`<div class="field"><label>${esc(key)} <span class="muted">${esc(label)}</span></label><input data-sms-provider="${esc(def.id)}" data-sms-key="${esc(key)}" type="${/SECRET|AUTH_KEY/.test(key)?'password':'text'}" value="${esc(values[key]||'')}" autocomplete="off" placeholder="请输入 ${esc(key)}"></div>`).join('')}</div>`;
}
function renderSmsProviderEditor(){
  const picker=document.getElementById('smsProviderChoices'),cards=document.getElementById('smsProviderCards'),selectedBox=document.getElementById('smsSelectedProviders');
  if(!picker||!cards)return;
  const activeId=cards.querySelector('.sms-provider-details[open]')?.dataset.smsDetails;
  picker.innerHTML=smsProviderDefinitions.map(def=>{const selected=smsSelectedProviders.has(def.id);return `<label class="sms-provider-choice ${selected?'selected':''}" data-sms-choice="${esc(def.id)}"><input type="checkbox" ${selected?'checked':''} onchange="toggleSmsProvider('${def.id}',this.checked)"><span class="sms-provider-choice-text"><b>${esc(def.name)}</b></span></label>`}).join('');
  const selected=smsProviderDefinitions.filter(def=>smsSelectedProviders.has(def.id));
  if(selectedBox)selectedBox.innerHTML=selected.length?selected.map(def=>`<button type="button" onclick="focusSmsProvider('${def.id}')">${esc(def.name)} · ${smsProviderProgress(def,smsDraftValues[def.id]).filled}/${def.fields.length}<span class="sms-selected-remove" title="移除厂商" onclick="event.stopPropagation();toggleSmsProvider('${def.id}',false)">×</span></button>`).join(''):'<span class="sms-selected-empty">勾选上方厂商后，配置卡片显示在这里</span>';
  cards.innerHTML=selected.map((def,index)=>{const progress=smsProviderProgress(def,smsDraftValues[def.id]);return `<details class="sms-provider-details" data-sms-details="${esc(def.id)}" ${def.id===(selected.some(item=>item.id===activeId)?activeId:selected[0]?.id)?'open':''}><summary><span><b>${esc(def.name)}</b><small>${progress.filled}/${progress.total} 项已填写</small></span><span class="sms-progress ${progress.complete?'complete':'incomplete'}">${progress.complete?'已完善':'待完善'}</span></summary>${smsProviderCard(def,smsDraftValues[def.id]||{})}</details>`}).join('')||'<div class="muted">选择厂商后显示对应参数</div>';
}
function focusSmsProvider(id){
  const details=[...document.querySelectorAll('#smsProviderCards .sms-provider-details')],chosen=details.find(item=>item.dataset.smsDetails===id);
  if(!chosen)return;details.forEach(item=>item.open=item===chosen);chosen.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function toggleSmsProvider(id,on){
  document.querySelectorAll('#smsProviderCards [data-sms-provider]').forEach(input=>{const provider=input.dataset.smsProvider;smsDraftValues[provider]??={};smsDraftValues[provider][input.dataset.smsKey]=input.value});
  on?smsSelectedProviders.add(id):smsSelectedProviders.delete(id);
  renderSmsProviderEditor();
}
editPartitionInterface=function(code,type){
  if(type!=='sms')return msg('该接口配置已移除');
  const partition=partitions.find(item=>item[1]===code);if(!partition||!visibleScopeIds().includes(code))return msg('该盘口不在当前可配置范围内');
  smsEditingPartition=code;const saved=smsProviderData(code);smsSelectedProviders=new Set(saved.selected);smsDraftValues=JSON.parse(JSON.stringify(saved.values||{}));
  modal('短信接口配置 · '+esc(partition[0]),`<div class="sms-provider-picker"><div class="sms-provider-picker-head"><b>短信厂商</b><span class="muted">勾选厂商，再填写下方参数</span></div><div class="sms-provider-choices" id="smsProviderChoices"></div><div class="sms-selected-wrap"><b>已选厂商 · 参数配置</b><div class="sms-selected-list" id="smsSelectedProviders"></div></div></div><div id="smsProviderCards"></div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePartitionInterface('${esc(code)}','sms')">保存配置</button></div>`);
  document.getElementById('modal').classList.add('sms-provider-editor');renderSmsProviderEditor();
};
savePartitionInterface=function(code,type){
  if(type!=='sms'||code!==smsEditingPartition||!partitions.some(item=>item[1]===code)||!visibleScopeIds().includes(code))return msg('该盘口不在当前可配置范围内');
  const values={};document.querySelectorAll('#smsProviderCards [data-sms-provider]').forEach(input=>{const provider=input.dataset.smsProvider;values[provider]??={};values[provider][input.dataset.smsKey]=input.value.trim()});
  if(!smsSelectedProviders.size)return msg('请至少选择一个短信厂商');
  partitionSmsProviders[code]={selected:[...smsSelectedProviders],values};
  partitionBusinessSettings[code]={...(partitionBusinessSettings[code]||{}),smsProvider:[...smsSelectedProviders].map(id=>smsProviderDefinitions.find(item=>item.id===id)?.name).filter(Boolean).join('、')};
  audit('保存短信接口配置 '+code);closeModal();render();msg('短信厂商配置已保存');
};
partitionInterfaceView=function(){
  const rows=partitions.filter(item=>visibleScopeIds().includes(item[1]));
  return `<div class="notice">按分盘维护短信厂商接入参数。每个分盘可配置多个短信厂商。</div><div class="panel"><div class="wide-scroll"><table><thead><tr><th>盘口名称</th><th>短信接口</th><th>操作</th></tr></thead><tbody>${rows.map(item=>{const code=item[1],selected=smsProviderData(code).selected,names=selected.map(id=>smsProviderDefinitions.find(def=>def.id===id)?.name).filter(Boolean);return `<tr><td><b>${esc(item[0])}</b></td><td><span class="tag ${names.length?'green':'orange'}">${names.length?'已配置':'待配置'}</span>${names.length?`<div class="muted">${names.map(esc).join('、')}</div>`:''}</td><td><button class="link" onclick="editPartitionInterface('${esc(code)}','sms')">短信配置</button></td></tr>`}).join('')||'<tr><td colspan="3" class="muted">当前盘口范围暂无可配置分盘</td></tr>'}</tbody></table></div></div>`;
};
render();
</script>
